<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>英语工具箱</title>
<style>
  :root{
    --bg:#0f1216; --card:rgba(23,28,34,.9); --line:#252c35; --fg:#e8edf3; --dim:#8b96a4;
    --acc:#4ea8de; --ok:#3ddc97; --warn:#ffc857;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background-color:var(--bg);color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding-bottom:env(safe-area-inset-bottom);
    background-image:linear-gradient(160deg, rgba(10,13,18,.60), rgba(10,13,18,.82)), url('背景.jpg');
    background-size:cover;background-position:center 42%;background-attachment:fixed;
  }
  #app{width:100%;max-width:560px;min-height:100%;display:flex;flex-direction:column;padding:26px 16px 30px}
  header{margin-bottom:22px}
  .title{font-size:14px;letter-spacing:.14em;color:var(--dim)}
  h1{font-size:26px;margin:6px 0 4px;font-weight:700}
  .sub{color:var(--dim);font-size:14px;margin:0}
  .entry{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;margin-top:14px;transition:.15s;
  }
  .entry:active{transform:scale(.985);border-color:#3a4757}
  .entry .row{display:flex;align-items:center;gap:14px}
  .icon{
    width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:#1c242c;border:1px solid var(--line);flex:0 0 auto;
  }
  .entry b{font-size:18px;font-weight:600;display:block}
  .entry .meta{color:var(--dim);font-size:13px;margin-top:2px}
  .arrow{margin-left:auto;color:#4a5461;font-size:20px}
  .empty{color:var(--dim);font-size:13px}
  footer{margin-top:auto;padding-top:20px;text-align:center;color:#4a5461;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">ENGLISH TOOLBOX</div>
    <h1>英语工具箱</h1>
    <p class="sub">先攒词，再纠错。两个工具各管一件事。</p>
  </header>

  <a class="entry" href="words/">
    <div class="row">
      <div class="icon">📚</div>
      <div>
        <b>背单词</b>
        <div class="meta" id="wordsMeta">—</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a class="entry" href="errors/">
    <div class="row">
      <div class="icon">📓</div>
      <div>
        <b>错题归因本</b>
        <div class="meta" id="errorsMeta">—</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <footer>数据只存在这台设备 · 两个工具各自都能导出备份</footer>
</div>

<script>
(function(){
  function readJSON(key){
    try{ return JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){ return null; }
  }

  // 背单词
  var w = readJSON('vocab') || readJSON('vocab_test');
  var learned = 0, due = 0;
  if(w && w.data){
    var now = Date.now();
    for(var k in w.data){
      var st = w.data[k];
      if(!st) continue;
      if(st.ever || (st.s || 0) > 0 || st.copied) learned++;
      if(st.due > 0 && st.due <= now) due++;
    }
  }
  document.getElementById('wordsMeta').textContent = learned
    ? ('已学 ' + learned + ' 个词' + (due ? ' · 待复习 ' + due : ' · 今天没有到期的'))
    : '还没开始 · 点进去背第一个词';

  // 错题本
  var e = readJSON('err_book_v1');
  var items = (e && e.items) || [];
  var today = items.filter(function(x){ return x.at >= Date.now() - 86400000; }).length;
  document.getElementById('errorsMeta').textContent = items.length
    ? ('共 ' + items.length + ' 条记录' + (today ? ' · 今天 ' + today + ' 条' : ''))
    : '还没记录 · 做错一道就记一条';

  // service worker（让浏览器认为是可安装应用）
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
