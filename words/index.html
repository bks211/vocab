(function(){
  function showUpdateBar(){
    if(document.getElementById('updBar')) return;
    var d = document.createElement('div');
    d.id = 'updBar';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:14px 16px;background:#4ea8de;color:#07121a;font-weight:700;text-align:center;cursor:pointer;font-size:15px';

    d.onclick = function(){ location.replace(location.pathname + '?v=' + Date.now()); };
    document.body.appendChild(d);
  }
  async function checkUpdate(silent){
    try{
      var r = await fetch('index.html?t=' + Date.now(), {cache:'no-store'});
      var t = await r.text();
      var m = t.match(/__BUILD\s*=\s*'([^']+)'/);
      if(m && m[1] && m[1] !== window.__BUILD){ showUpdateBar(); return true; }
      if(!silent && window.toast) window.toast('已经是最新版本');
    }catch(e){
      if(!silent && window.toast) window.toast('检查更新失败，稍后再试');
    }
    return false;
  }
  window.checkUpdate = checkUpdate;
  window.addEventListener('load', function(){ setTimeout(function(){ checkUpdate(true); }, 1800); });
  setInterval(function(){ checkUpdate(true); }, 5 * 60 * 1000);
})();

/* 一次性修正：旧版把“复习过”也标成“今天学的”，把这些清掉 */
function fixTodayWords(){
  if(S.migV4) return 0;
  const t = todayStr();
  const tom4 = dueAfterDays(1);
  let n = 0;
  for(const w in S.data){
    const st = S.data[w];
    if(!st || st.day !== t) continue;
    const looksNew = (st.s || 0) <= 1 && st.due && st.due <= tom4 + 3600000;
    if(!looksNew){ st.day = ''; n++; }
  }
  S.migV4 = true;
  save();
  return n;
}

/* 老数据补一个「学过」标记：有等级或抄写过的，都算学过 */
function backfillEver(){
  let n = 0;
  for(const w in S.data){
    const st = S.data[w];
    if(st && !st.ever && ((st.s || 0) > 0 || st.copied)){ st.ever = 1; n++; }
  }
  if(n) save();
  return n;
}

/* 某个词库的进度：passed=学过一遍（只增），current=当前还记着（≥3 级） */
function deckStats(key){
  let base;
  if(key === 'game') base = GAME;
  else if(key === 'ach') base = ACH;
  else if(key === 'steam') base = STEAM;
  else if(key === 'func') base = FUNC;
  else if(key === 'imported') base = (S.imported && S.imported.list ? S.imported.list : []);
  else if(key === 'cet4') base = CET4;
  else {
    const seen = new Set(); base = [];
    for(const x of GAME.concat(ACH, STEAM, FUNC, CET4)){ if(!seen.has(x.w)){ seen.add(x.w); base.push(x); } }
  }
  let passed = 0, current = 0;
  for(const x of base){
    const st = S.data[x.w];
    if(!st) continue;
    if(st.ever || (st.s || 0) > 0 || st.copied) passed++;
    if((st.s || 0) >= 3) current++;
  }
  return { total: base.length, passed, current };
}

/* 一天从凌晨 4 点算起：0~4 点仍属于“昨天” */
function dayBase(){
  return new Date(Date.now() - 4*3600*1000);
}
function todayStr(){
  const d = dayBase();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* 按“天”排期：n 天后凌晨 4 点到期 */
function dueAfterDays(n){
  const d = dayBase();
  d.setHours(4, 0, 0, 0);
  d.setDate(d.getDate() + Math.max(1, n));
  return d.getTime();
}

function stats(){
  let mastered=0, learning=0, unseen=0;
  for(const x of deckWords()){
    const st=S.data[x.w];
    if(!st) unseen++; else if(st.s>=MASTER_STAGE) mastered++; else learning++;
  }
  const total = S.ok + S.bad;
  return {mastered, learning, unseen, acc: total? Math.round(S.ok/total*100):0, total, all:deckWords().length};
}

/* 编辑距离：判断“是不是把别的词拼成了这个词” */
function lev(a, b){
  a = String(a).toLowerCase(); b = String(b).toLowerCase();
  const m = a.length, n = b.length;
  const dp = [];
  for(let i=0;i<=m;i++){ dp[i] = [i]; }
  for(let j=1;j<=n;j++){ dp[0][j] = j; }
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
  }
  return dp[m][n];
}
/* 打错时：看看是不是拼成了另一个词，是的话记成易混淆对 */
function recordConfusion(item, typed){
  const t = String(typed || '').trim().toLowerCase();
  if(!t) return;
  const pool = deckWords().filter(x=>x.w !== item.w);
  let best = null, bestD = 99;
  for(const x of pool){
    const d = lev(t, x.w);
    if(d < bestD){ bestD = d; best = x; }
  }
  if(!best || bestD > 2) return;
  if(lev(t, item.w) <= bestD) return;   // 不是拼成别的词，只是拼错
  const keyA = item.w, keyB = best.w;
  const list = S.confuse || (S.confuse = []);
  if(!list.some(p=>(p.a===keyA && p.b===keyB) || (p.a===keyB && p.b===keyA))){
    list.push({a:keyA, b:keyB, at:Date.now()});
    save();
    toast('⚠️ 记下了易混：' + keyA + ' / ' + keyB);
  }
}
/* 把打错的字母标出来（正确的词，位置不对的字母加红色下划线） */
function diffHtml(word, typed){
  const w = String(word), t = String(typed).toLowerCase();
  let out = '';
  for(let i=0;i<w.length;i++){
    const same = i < t.length && t[i] === w[i].toLowerCase();
    out += same ? esc(w[i]) : '<u style="text-decoration-color:#ff6b6b;text-underline-offset:3px">' + esc(w[i]) + '</u>';
  }
  return '<b>' + out + '</b>';
}

let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, start, dur, type, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol || 0.16, c.currentTime + start + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
}

/* 生成 WAV 并用 <audio> 播放：比 Web Audio 兼容性更好（file:// 下也能出声） */
function renderTones(notes, sr, dur){
  const n = Math.floor(sr * dur);
  const a = new Float32Array(n);
  for(const nt of notes){
    const st = Math.floor(nt.t * sr);
    const len = Math.floor(nt.d * sr);
    for(let i = 0; i < len && st + i < n; i++){
      const tt = i / sr;
      const env = Math.min(1, tt / 0.008) * Math.exp(-tt * 5.5);
      let s = Math.sin(2*Math.PI*nt.f*tt);
      if(nt.h) s += 0.35 * Math.sin(4*Math.PI*nt.f*tt);
      a[st + i] += s * env * (nt.v || 0.3);
    }
  }
  return a;
}
function wavDataUri(samples, sr){
  const len = samples.length;
  const buf = new ArrayBuffer(44 + len*2);
  const v = new DataView(buf);
  const wr = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  wr(0,'RIFF'); v.setUint32(4, 36 + len*2, true); wr(8,'WAVE'); wr(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  wr(36,'data'); v.setUint32(40, len*2, true);
  for(let i=0;i<len;i++){
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i*2, s*32767, true);
  }
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}

/* ===== 烟花特效 ===== */
let FW = null;
function fwInit(){
  if(FW) return FW;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  document.body.appendChild(c);
  const fit = ()=>{ c.width = innerWidth; c.height = innerHeight; };
  fit(); window.addEventListener('resize', fit);
  FW = {c, ctx: c.getContext('2d'), parts: [], raf: 0};
  return FW;
}
function fireworks(n){
  const f = fwInit();
  const W = f.c.width, H = f.c.height;
  for(let k=0; k<(n||3); k++){
    const x = W * (0.18 + Math.random()*0.64);
    const y = H * (0.18 + Math.random()*0.34);
    const hue = Math.floor(Math.random()*360);
    const cnt = 44;
    for(let i=0;i<cnt;i++){
      const a = (Math.PI*2*i)/cnt + Math.random()*0.18;
      const sp = 2.0 + Math.random()*3.0;
      f.parts.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, hue: hue + Math.random()*40});
    }
  }
  if(!f.raf) f.raf = requestAnimationFrame(fwTick);
}
function fwTick(){
  const f = FW; if(!f) return;
  const {ctx, c} = f;
  ctx.clearRect(0, 0, c.width, c.height);
  f.parts = f.parts.filter(p=>p.life > 0);
  for(const p of f.parts){
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.986; p.vy *= 0.986; p.life -= 0.011;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue},100%,${58 + p.life*22}%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.4 * Math.max(0.25, p.life), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(f.parts.length) f.raf = requestAnimationFrame(fwTick);
  else { ctx.clearRect(0,0,c.width,c.height); f.raf = 0; }
}

/* 选择题键盘：上下移动，回车确认 */
function bindOptions(){
  const opts = Array.prototype.slice.call(document.querySelectorAll('.opt'));
  if(!opts.length) return;
  let sel = 0;
  const paint = ()=> opts.forEach((o,i)=> o.classList.toggle('sel', i === sel && !o.disabled));
  paint();
  if(optKeys){ document.removeEventListener('keydown', optKeys); }
  optKeys = (e)=>{
    if(!document.body.contains(opts[0])){ document.removeEventListener('keydown', optKeys); return; }
    if(opts[0].disabled) return;
    if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); sel = (sel + 1) % opts.length; paint(); }
    else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); sel = (sel - 1 + opts.length) % opts.length; paint(); }
    else if(e.key === 'Enter'){ e.preventDefault(); opts[sel].click(); }
  };
  document.addEventListener('keydown', optKeys);
}

/* ============ 功能词·场景卡（结构 + 例句 + 规律 + 填空） ============ */
const SCENES = [
  { head:'to · 给谁', rule:'动词 + 宾语 + to + 人（把东西给出去）',
    ex:['Give it to me.','Send the file to him.','Please explain the rule to us.'],
    bad:'✗ give me it（英语不这么说，除非是代词宾语的固定搭配）',
    q:'Please explain the rule ____ us.', opts:['for','to','with','at'], ans:1,
    why:'explain sth to sb 是固定结构：解释给某人听。' },

  { head:'to · 方向', rule:'go / come / walk / fly + to + 地点',
    ex:['I go to school by bus.','Walk to the end of the street.','She flew to Tokyo.'],
    bad:'✗ go home to（home 前面不加 to）',
    q:'He walked ____ the door and knocked.', opts:['to','at','in','on'], ans:0,
    why:'walk to + 目的地，表示朝那里走过去。' },

  { head:'to · 表目的（不定式）', rule:'动作 + to do，说明做这件事是为了什么',
    ex:['I came to help you.','She went out to buy milk.','He stopped to rest.'],
    bad:'对比：stop to rest（停下来去休息）vs stop resting（停止休息）',
    q:'He stopped ____ a cigarette.', opts:['smoke','to smoke','smoking','smoked'], ans:1,
    why:'stop to do = 停下来去做另一件事；stop doing = 停止正在做的事。' },

  { head:'for · 为了（给谁/为什么）', rule:'for + 名词，表示目的或受益者',
    ex:['This gift is for you.','I booked a room for two.','Thanks for your help.'],
    bad:'✗ This gift is to you（给某人用 for）',
    q:'I bought this book ____ my sister.', opts:['to','for','at','with'], ans:1,
    why:'buy sth for sb = 给某人买某物；受益者用 for。' },

  { head:'for · 持续多久', rule:'for + 一段时间（多久）',
    ex:['I stayed there for three days.','Wait for ten minutes.','She has lived here for years.'],
    bad:'对比：since 2018（从某点起）vs for 3 years（持续多久）',
    q:'We waited ____ two hours.', opts:['since','for','in','during'], ans:1,
    why:'two hours 是一段时间，用 for；since 后面跟时间点。' },

  { head:'in · 内部 / 范围内', rule:'in + 立体空间、城市、年份、月份',
    ex:['The key is in the box.','She lives in Beijing.','It happened in 2024.'],
    bad:'✗ in the table（桌面是表面，用 on）',
    q:'The money is ____ my pocket.', opts:['on','in','at','by'], ans:1,
    why:'口袋是内部空间，用 in。' },

  { head:'in · 多久之后（将来）', rule:'in + 一段时间 = 过多久以后（用于将来）',
    ex:['I will be back in ten minutes.','The train leaves in two hours.'],
    bad:'对比：after ten minutes 也可以，但 in 更常用于“从现在算起”',
    q:'The movie starts ____ five minutes.', opts:['after','in','for','at'], ans:1,
    why:'从现在起五分钟后开始，用 in five minutes。' },

  { head:'on · 表面接触', rule:'on + 表面（桌面、墙、屏幕），也用于乘坐',
    ex:['The book is on the table.','Put it on the wall.','I met him on the bus.'],
    bad:'✗ on the box 内部（内部用 in）',
    q:'There is a picture ____ the wall.', opts:['in','on','at','to'], ans:1,
    why:'挂在墙上，接触墙面，用 on。' },

  { head:'on · 具体某天', rule:'on + 具体日期、星期、某天',
    ex:['We meet on Monday.','It happened on May 1st.','See you on my birthday.'],
    bad:'对比：in May（月份）、on May 1st（具体某天）',
    q:'The exam is ____ Friday morning.', opts:['in','at','on','for'], ans:2,
    why:'具体到某一天（哪怕带 morning），介词用 on。' },

  { head:'at · 具体时刻 / 点', rule:'at + 钟点、night、门口等“点”',
    ex:['The class starts at 8 o\'clock.','He works at night.','Wait at the door.'],
    bad:'对比：in the morning（一段时间）vs at night（固定搭配）',
    q:'She usually gets up ____ six.', opts:['in','on','at','for'], ans:2,
    why:'具体钟点前用 at。' },

  { head:'with · 和谁一起 / 用什么工具', rule:'with + 人（一起）或 + 工具（用）',
    ex:['Come with me.','Cut it with a knife.','He wrote it with a pencil.'],
    bad:'✗ use a knife to cut it with（重复）',
    q:'Please write your name ____ a pen.', opts:['by','with','in','on'], ans:1,
    why:'用具体工具，介词用 with。' },

  { head:'by · 手段 / 被动施动 / 截止', rule:'by + 交通方式、by + 人（被动）、by + 时间（不迟于）',
    ex:['I go to work by bus.','This song was written by him.','Finish it by Friday.'],
    bad:'✗ by a pen（具体工具用 with）',
    q:'The report must be finished ____ Friday.', opts:['until','by','at','in'], ans:1,
    why:'by + 时间点 = 不迟于某个时间，强调截止。' },

  { head:'if · 真实条件', rule:'If + 现在时，主句用将来时（主将从现）',
    ex:['If it rains, we will stay home.','If you study, you will pass.'],
    bad:'✗ If it will rain...（条件句里不用 will）',
    q:'If it ____ tomorrow, we will cancel the trip.', opts:['will rain','rains','rained','is raining'], ans:1,
    why:'主将从现：条件从句用一般现在时。' },

  { head:'unless · 除非（= if not）', rule:'unless + 肯定句 = if ... not',
    ex:['You cannot pass unless you study.','I will go unless it rains.'],
    bad:'✗ unless you don\'t study（双重否定）',
    q:'You will fail ____ you work harder.', opts:['if','unless','because','although'], ans:1,
    why:'unless = 除非、如果不，后面不再加否定。' },

  { head:'when vs while', rule:'when 可接短暂动作；while 接持续性动作（常进行时）',
    ex:['When he arrived, we left.','While I was cooking, he called.'],
    bad:'对比：While he arrived（arrive 是瞬间动作，不用 while）',
    q:'____ I was walking home, it started to rain.', opts:['When','While','Until','Since'], ans:1,
    why:'was walking 是持续动作，用 while。' },

  { head:'because vs so', rule:'because 给原因，so 给结果；两个不能同时用',
    ex:['I stayed home because it rained.','It rained, so I stayed home.'],
    bad:'✗ Because it rained, so I stayed home.',
    q:'He was tired, ____ he went to bed early.', opts:['because','so','although','unless'], ans:1,
    why:'后半句是结果，用 so。' },

  { head:'although vs but', rule:'although 引导让步从句；不能 although…but 双用',
    ex:['Although it was hard, I finished it.','It was hard, but I finished it.'],
    bad:'✗ Although it was hard, but I finished it.',
    q:'____ he is poor, he is happy.', opts:['Although','But','Because','So'], ans:0,
    why:'although 开头引导让步，后面主句不再用 but。' },

  { head:'that · 引导宾语从句', rule:'动词后接 that + 完整句子，that 可省略',
    ex:['I think that he is right.','She said that she was busy.'],
    bad:'✗ I think he is right that（位置错）',
    q:'I believe ____ he will come.', opts:['what','that','which','who'], ans:1,
    why:'believe 后接完整的宾语从句，用 that。' },

  { head:'which vs that · 定语从句', rule:'限定性定语从句两者皆可；非限定（逗号后）只用 which',
    ex:['The book that/which I bought is good.','He passed the exam, which surprised us.'],
    bad:'✗ He passed the exam, that surprised us.',
    q:'She got full marks, ____ surprised everyone.', opts:['that','which','who','what'], ans:1,
    why:'逗号后的非限定定语从句只能用 which。' },

  { head:'since vs for', rule:'since + 时间点（自从）；for + 一段时间（持续）',
    ex:['I have lived here since 2018.','I have lived here for six years.'],
    bad:'✗ since six years（since 后必须是时间点）',
    q:'I have known him ____ ten years.', opts:['since','for','in','from'], ans:1,
    why:'ten years 是一段时间，用 for。' }
];

  const extraCount = todayWords().filter(x=>((S.data[x.w]||{}).src === 'extra')).length;
  const needReview = tw.length > 0 && S.reviewedDate !== todayStr();
  const reviewedToday = tw.length > 0 && S.reviewedDate === todayStr();
  const nowHM = (()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); })();
  const pastRemind = S.remind && nowHM >= S.remind;
  const fired = S.firedAt && S.reviewedDate !== todayStr();
  const tLeft = S.timerAt && S.timerAt > Date.now() ? Math.ceil((S.timerAt - Date.now()) / 60000) : 0;

  // 回顾按钮的开放逻辑：
  //   还没回顾 → 背完新词 +15 分钟才开
  //   已回顾过 → 上一轮回顾之后冷却 2 小时才再开
  const nowTs = Date.now();
  let gateAt, gateHint;
  if(!tw.length){ gateAt = -1; gateHint = '还没有今天的词'; }
  else if(!reviewedToday){
    if(S.firedAt){ gateAt = 0; gateHint = ''; }
    else if(S.studyAt){ gateAt = (S.studyAt||0) + 15*60000; gateHint = ''; }
    else { gateAt = -1; gateHint = '背完新词后可点'; }
  } else {
    // 每天最多 3 次回顾，用完锁死
    const cntToday = (S.reviewCountDay === todayStr()) ? (S.reviewCount || 0) : 0;
    if(cntToday >= 3){
      gateAt = -3;
      gateHint = '今天 3 次已用完，明天再来';
    } else {
      gateAt = (S.lastReviewAt||0) + 60*60000;
      gateHint = '';
    }
  }
  const canReview = gateAt === 0 || (gateAt > 0 && gateAt <= nowTs);
  let waitMin = 0;
  if(gateAt > nowTs) waitMin = Math.ceil((gateAt - nowTs)/60000);
  const banner = needReview
    ? `<div class="card" style="border-color:${fired?'#7a5a12':(pastRemind?'#5a4a1f':'#2b3540')};background:${fired?'rgba(255,200,87,.13)':(pastRemind?'rgba(255,200,87,.08)':'#171c22')}">
         <div class="row"><b>${fired?'⏱ 15 分钟到了，该背第二遍了':'今天学的 '+tw.length+' 个词还没回顾'}</b><span class="tag">${fired?'现在':esc(S.remind||'21:30')+' 提醒'}</span></div>
         <div class="muted" style="margin-top:6px">${fired?'2 分钟过一遍就行，趁记忆还在。':'睡前点一次，借睡眠把它们固定下来。'}</div>
         ${canReview
           ? `<button class="btn primary sm" id="review2" style="margin-top:12px">${fired?'开始第二次复习':'再回顾一次'}</button>`
           : `<button class="btn sm" disabled style="margin-top:12px;opacity:.45;cursor:not-allowed">${gateAt<0?gateHint:waitMin+' 分钟后可以回顾'}</button>`}
       </div>`
    : (reviewedToday ? `<div class="card" style="border-color:#22533c;background:rgba(61,220,151,.06)">
         <div class="row"><b style="color:#9be9c4">✅ 今天已回顾 ${S.reviewCount||1} 次</b><span class="tag">${((S.reviewCountDay===todayStr()?S.reviewCount:0) >= 3) ? '今日已用完' : '还剩 '+Math.max(0,3-((S.reviewCountDay===todayStr()?S.reviewCount:0))) +' 次'}</span></div>
       </div>` : '');

  const timerCard = (tLeft > 0 && S.reviewedDate !== todayStr())
    ? `<div class="card" style="border-color:#2b3f52;background:rgba(78,168,222,.07)">
         <div class="row"><b>⏱ 第二次复习</b><span class="tag">还有 ${tLeft} 分钟</span></div>
         <div class="muted" style="margin-top:6px">到点会弹通知，2 分钟再过一遍今天的词。</div>
       </div>` : '';

  const pending = loadSession();
  const canResume = pending && pending.idx < pending.queue.length;
  // 按队列内容决定叫「继续背」还是「继续复习」
  let resumeLabel = '';
  if(canResume){
    const rest = pending.queue.slice(pending.idx);
    const allReview = rest.every(x=>{ const st = S.data[x.w]; return st && (st.s || 0) > 0; });
    const verb = pending.review ? '继续回顾' : (allReview ? '继续复习' : '继续背');
    resumeLabel = `${verb}（还剩 ${rest.length} 张）`;
  }
  const reviewBtn = tw.length
    ? (reviewedToday
        ? `<div class="card" style="text-align:center;border-color:#24533e;background:rgba(26,50,40,.55)">
             <div style="font-size:17px;color:#3ddc97">✅ 今日回顾已完成</div>
             <div class="muted" style="margin-top:4px">今天的 ${tw.length} 个词都过了一遍，可以收工了</div>
           </div>`
        : (canReview
            ? `<button class="btn" id="review">🔁 今日回顾（${tw.length} 词 · 30 秒）</button>`
            : `<button class="btn" id="review" disabled style="opacity:.45;cursor:not-allowed">🔁 今日回顾 · ${gateAt < 0 ? gateHint : waitMin + ' 分钟后可点'}</button>`
              + (gateAt > 0 && S.earlyReviewDate !== todayStr() ? `<button class="btn ghost" id="reviewNow" style="font-size:14px;padding:10px;margin-top:6px">今天要早睡？现在就回顾（每天一次）</button>` : '')))
    : '';

  $("#view").innerHTML = `
    ${banner}
    ${timerCard}
    <h1>${done ? '今天完成了' : '今天要背的'}</h1>
    <p class="sub">词库：${deckName(S.deck)} · 已学 ${deckStats(S.deck).passed} / ${deckStats(S.deck).total} · 当前记住 ${deckStats(S.deck).current}</p>
    <div class="card">
      <div class="row"><span>待复习</span><b style="font-size:22px">${due}</b></div>
      <div class="row" style="margin-top:8px"><span>今日必学</span><b style="font-size:22px">${Math.min(todayCoreWords().length, S.goal)}<span class="muted"> / ${S.goal}</span></b></div>
      ${extraCount > 0 ? `<div class="row" style="margin-top:8px"><span>额外学习</span><b style="font-size:22px">${extraCount}</b></div>` : ''}
    </div>
    <button class="btn primary" id="start" ${(!canResume && newLeft === 0) ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>${canResume ? resumeLabel : (newLeft > 0 ? '开始背单词' : (quotaLeft ? '词库已背完（换词库或加词）' : '今日新词已完成'))}</button>
    ${(!canResume && quotaLeft && deckEmpty) ? `<div class="muted" style="text-align:center;margin-top:6px">当前词库已经没有没学过的词了 · 去设置换词库，或点「添加生词」</div>` : ''}
    ${due > 0
      ? `<button class="btn" id="dueR">📈 记忆曲线复习（${due} 个到期）</button>`
      : `<button class="btn" disabled style="opacity:.45;cursor:not-allowed">📈 记忆曲线复习 · 现在没有到期的词</button>`}
    ${(tw.length + due) > 0
      ? (reviewedToday
          ? `<button class="btn ghost" id="mixedR" style="font-size:14px;padding:11px">🌙 再看一遍（额外练习，不计入）</button>`
          : `<button class="btn" id="mixedR">🌙 睡前总复习（${tw.length + due} 个）</button>`)
      : ''}
    ${(S.confuse && S.confuse.length) ? (S.confuse.filter(p=>!p.due || p.due <= Date.now()).length > 0
      ? `<button class="btn" id="pairDrill">⚠️ 易错单词辨别（${S.confuse.filter(p=>!p.due || p.due <= Date.now()).length} 组待练）</button>`
      : `<button class="btn" disabled style="opacity:.45;cursor:not-allowed">⚠️ 易错单词辨别 · 今天的练完了</button>`) : ''}
    <button class="btn ghost" id="extra" style="font-size:14px;padding:11px">＋ 额外学 5 个（不计入今日目标）</button>
    <button class="btn" id="sceneBtn" style="color:#4ea8de">🧩 场景练习（功能词 20 张）</button>
    ${(()=>{ const n = deckWords().filter(x=>((S.data[x.w]||{}).pron||0) > 0).length; return n ? `<button class="btn" id="pronR" style="color:#ffc857">🔈 发音存疑（${n} 个）</button>` : ''; })()}
    ${done ? `<button class="btn ghost" id="free" style="font-size:14px;padding:11px">🎮 自由练习（不按计划）</button>` : ''}
    ${(S.readDate === todayStr())
      ? `<button class="btn ghost" disabled style="font-size:14px;padding:11px;opacity:.5;cursor:not-allowed">✅ 今天的 5 个词读过了</button>`
      : `<button class="btn ghost" id="readR" style="font-size:14px;padding:11px">🎤 跟读 5 个词（30 秒，只读不打）</button>`}
    ${(()=>{
      const cand = testCandidates().length;
      if(cand < 4) return '';
      const days = S.testLog && S.testLog.at ? (Date.now() - S.testLog.at) / 86400000 : 999;
      if(days < 30) return `<button class="btn ghost" disabled style="font-size:14px;padding:11px;opacity:.5;cursor:not-allowed">📋 自测已完成（${Math.ceil(30 - days)} 天后再测）</button>`;
      return `<button class="btn ghost" id="selfTest" style="font-size:14px;padding:11px;color:#4ea8de">📋 月度自测（${Math.min(10, cand)} 句，判断要不要学语法）</button>`;
    })()}
    ${reviewBtn}
    <button class="btn" id="add">＋ 添加生词</button>
    <div class="grid" style="margin-top:6px">
      <button class="btn ghost" id="stats">统计</button>
      <button class="btn ghost" id="settings">设置</button>
    </div>
    <div class="grid" style="margin-top:14px">
      <div class="stat"><b>${st.mastered}</b><span>已掌握</span></div>
      <div class="stat"><b>${st.learning}</b><span>学习中</span></div>
      <div class="stat"><b>${st.acc}%</b><span>正确率</span></div>
      <div class="stat"><b>${S.custom.length}</b><span>我的生词</span></div>
    </div>
  `;
  $("#start").onclick = ()=>{
    if(canResume){
      const p = loadSession();
      if(p){ session = p; renderCard(); return; }
    }
    startSession(done, 'core');
  };
  if($("#sceneBtn")) $("#sceneBtn").onclick = startScenes;
  if($("#extra")) $("#extra").onclick = ()=>{
    if(!confirm('额外学 5 个词：不计入今日目标，也不进今晚的回顾。继续？')) return;
    startSession(false, 'extra');
  };
  if($("#pronR")) $("#pronR").onclick = startPronDrill;
  if($("#readR")) $("#readR").onclick = startReadDrill;
  if($("#selfTest")) $("#selfTest").onclick = startSelfTest;
  if($("#dueR")) $("#dueR").onclick = startDueReview;
  if($("#mixedR")) $("#mixedR").onclick = startMixedReview;
  if($("#free")) $("#free").onclick = ()=> startSession(true, 'core');
  if($("#pairDrill")) $("#pairDrill").onclick = startPairDrill;
  if($("#review")) $("#review").onclick = startReview;
  if($("#reviewNow")) $("#reviewNow").onclick = ()=>{
    S.earlyReviewDate = todayStr();
    save();
    startReview();
  };
  if($("#review2")) $("#review2").onclick = startReview;
  $("#add").onclick = renderAdd;
  $("#stats").onclick = renderStats;
  $("#settings").onclick = renderSettings;
}

    <div class="card">
      <input type="text" id="w" placeholder="英文单词（必填）" autocapitalize="off" autocomplete="off" spellcheck="false">
      <input type="text" id="m" placeholder="中文意思（必填，如 v. 装备）">

    </div>
    <p class="muted">存进去的词会自动进入复习队列，明天就会考你。</p>
  `;
  $("#w").focus();
  $("#ok").onclick = ()=>{
    const w = ($("#w").value||'').trim();
    const m = ($("#m").value||'').trim();

    if(S.custom.some(x=>x.w.toLowerCase()===w.toLowerCase())){
      if(!confirm('这个词已经在生词本里了，再存一份？')) return;
    }

function todayWords(){ return allDeckWords().filter(x=>{ const st=S.data[x.w]; return st && st.day === todayStr(); }); }
/* 只算「今日必学」的词（额外学的另算） */
function todayCoreWords(){
  return todayWords().filter(x=>{ const st=S.data[x.w]; return st && st.src !== 'extra'; });
}

/* 词根拆解：只在「长词 + 错过 ≥3 次」时给 */
function rootInfoOf(item, data){
  if(!item || !item.w) return null;
  if(item.w.replace(/[^a-zA-Z]/g,'').length < 6) return null;
  if(!data || (data.bad || 0) < 3) return null;
  return ROOTS[item.w.toLowerCase()] || null;
}
function rootPanelHtml(info){
  if(!info) return '';
  const parts = (info.parts || []).map(p=>`<b>${esc(p[0])}</b>（${esc(p[1])}）`).join(' + ');
  return `<div style="text-align:left;line-height:1.9">
    <div><span style="color:#8b96a4">词性</span> ${esc(info.pos || '—')}</div>
    ${parts ? `<div><span style="color:#8b96a4">拆解</span> ${parts}</div>` : ''}
    ${info.family && info.family.length ? `<div><span style="color:#8b96a4">同族</span> ${info.family.map(esc).join(' / ')}</div>` : ''}
    ${info.colloc ? `<div><span style="color:#8b96a4">搭配</span> ${esc(info.colloc)}</div>` : ''}
    ${info.hook ? `<div style="margin-top:6px;color:#ffc857">记：${esc(info.hook)}</div>` : ''}
  </div>`;
}

function startReview(){
  const cntToday = (S.reviewCountDay === todayStr()) ? (S.reviewCount || 0) : 0;
  if(cntToday >= 3) return;
  // 第一次回顾：今天学的词一个不落全考（这是学习步骤，不能筛）
  // 之后的回顾：跳过 10 分钟内刚看过的，避免靠短期记忆
  const firstRound = cntToday === 0;
  const now = Date.now();
  let pool = todayCoreWords().filter(x=>{
    if(firstRound) return true;
    const st = S.data[x.w] || {};
    return !st.lastAt || (now - st.lastAt) >= 10*60000;
  });
  if(pool.length < 3) pool = todayCoreWords();
  // 一次回顾最多考「每日目标」那么多，超出的分到下一轮
  const cap = Math.max(5, S.goal || 10);
  const list = shuffle(pool.slice()).slice(0, cap);
  if(!list.length) return;
  session = {queue:list, idx:0, retry:[], total:list.length, review:true};
  renderCard();
}

/* ===== 中途退出：把没背完的队列存起来，下次接着来 ===== */
const SESSION_KEY = KEY + '_session';
function saveSession(){
  try{
    if(!session){ localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      queue: session.queue.map(x=>x.w),
      idx: session.idx,
      retry: session.retry.map(x=>x.w),
      review: !!session.review,
      total: session.total,
      at: Date.now()
    }));
  }catch(e){}
}
function loadSession(){
  try{
    const o = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(!o || !Array.isArray(o.queue) || !o.queue.length) return null;
    if(Date.now() - (o.at||0) > 6*3600*1000) return null;   // 超过 6 小时就当过期
    const map = new Map(deckWords().map(x=>[x.w, x]));
    const q = o.queue.map(w=>map.get(w)).filter(Boolean);
    if(!q.length) return null;
    return {
      queue: q,
      idx: Math.min(o.idx||0, q.length),
      retry: (o.retry||[]).map(w=>map.get(w)).filter(Boolean),
      review: !!o.review,
      total: o.total || q.length
    };
  }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function startDueReview(){
  const due = shuffle(dueList().slice());
  if(!due.length) return;
  session = {queue: due, idx:0, retry:[], total:due.length, src:'due'};
  saveSession();
  renderCard();
}

function startMixedReview(){
  const seen = new Set(); const q = [];
  const todayList = todayCoreWords();
  for(const x of todayList){ if(!seen.has(x.w)){ seen.add(x.w); q.push(x); } }
  for(const x of dueList()){ if(!seen.has(x.w)){ seen.add(x.w); q.push(x); } }
  if(!q.length) return;
  session = {queue: shuffle(q), idx:0, retry:[], total:q.length, src:'mixed', cover: todayList.map(x=>x.w)};
  saveSession();
  renderCard();
}

function startPairDrill(){
  const now = Date.now();
  const pairs = (S.confuse || []).filter(p=>!p.due || p.due <= now);
  if(!pairs.length) return;
  const map = new Map(deckWords().map(x=>[x.w, x]));
  const cards = [];
  for(const pr of pairs){
    const A = map.get(pr.a), B = map.get(pr.b);
    if(!A || !B) continue;
    const key = pr.a < pr.b ? pr.a + '|' + pr.b : pr.b + '|' + pr.a;
    cards.push(Object.assign({}, A, {__pair:{other:B.w, otherM:B.m, key}}));
    cards.push(Object.assign({}, B, {__pair:{other:A.w, otherM:A.m, key}}));
  }
  if(!cards.length) return;
  session = {queue: shuffle(cards), idx:0, retry:[], total:cards.length, src:'pair', pairOk:{}, pairBad:{}};
  saveSession();
  renderCard();
}

/* 导入/导出词库：给朋友做的词表，粘 JSON 或选文件都能用 */
function openDeckImport(){
  const d = document.createElement('div');
  d.id = 'impMask';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = `<div class="card" style="max-width:520px;width:100%;max-height:82vh;overflow:auto;margin:0">
    <b>导入词库</b>
    <p class="muted" style="margin:6px 0 10px">把别人给你的 JSON 粘进来，或选一个 .json 文件。<br>格式：[{w:"word", m:"释义", e:"例句"}]</p>
    <textarea id="impText" style="width:100%;height:150px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f141a;color:var(--fg);font-size:15px;font-family:inherit" placeholder="粘贴 JSON…"></textarea>
    <input type="file" id="impFile" accept=".json,application/json" style="margin-top:10px;color:var(--dim)">
    <div class="fb" id="impFb" style="display:none"></div>
    <button class="btn primary" id="impGo">导入</button>
    <button class="btn ghost" id="impCancel">取消</button>
  </div>`;
  document.body.appendChild(d);
  const close = ()=> d.remove();
  d.onclick = (e)=>{ if(e.target === d) close(); };
  $("#impCancel").onclick = close;
  $("#impFile").onchange = ()=>{
    const f = $("#impFile").files && $("#impFile").files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ $("#impText").value = String(r.result || ''); };
    r.readAsText(f, 'utf-8');
  };
  $("#impGo").onclick = ()=>{
    const fb = $("#impFb");
    fb.style.display = 'block';
    const raw = ($("#impText").value || '').trim();
    if(!raw){ fb.className = 'fb bad'; fb.textContent = '先粘一段 JSON 或选文件'; return; }
    let data;
    try{ data = JSON.parse(raw); }catch(e){ fb.className = 'fb bad'; fb.textContent = 'JSON 格式不对：' + e.message; return; }
    let name = '导入词库';
    if(data && !Array.isArray(data) && Array.isArray(data.words)){ name = data.name || name; data = data.words; }
    if(!Array.isArray(data)){ fb.className = 'fb bad'; fb.textContent = '需要一个数组，或 {name, words:[...]}'; return; }
    const list = [];
    const seen = new Set();
    for(const x of data){
      if(!x || !x.w) continue;
      const w = String(x.w).trim();
      if(!w || seen.has(w.toLowerCase())) continue;
      seen.add(w.toLowerCase());
      list.push({w, p: x.p || '', m: x.m || '', e: x.e || ''});
    }
    if(!list.length){ fb.className = 'fb bad'; fb.textContent = '没解析出词条（每条至少要有 w 和 m）'; return; }
    S.imported = {name, list, at: Date.now()};
    S.deck = 'imported';
    save();
    close();
    renderSettings();
    toast('📥 导入成功：' + name + '（' + list.length + ' 词）');
  };
}

function exportDeck(){
  if(!S.imported || !S.imported.list || !S.imported.list.length){ toast('现在没有导入的词库'); return; }
  const blob = new Blob([JSON.stringify({name: S.imported.name, words: S.imported.list}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.imported.name || '词库') + '.json';
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
}

function startPronDrill(){
  const list = deckWords().filter(x=>((S.data[x.w]||{}).pron || 0) > 0);
  if(!list.length) return;
  session = {queue: shuffle(list.slice()).slice(0, 20), idx:0, retry:[], total: Math.min(20, list.length), src:'pron'};
  saveSession();
  renderCard();
}

/* 跟读 5 个词：只出声，不考试 */
function startReadDrill(){
  const pool = todayCoreWords().length >= 3
    ? todayCoreWords()
    : deckWords().filter(x=>{ const st = S.data[x.w]; return st && (st.s || 0) > 0; });
  if(!pool.length){ toast('还没有学过的词，先背几个吧'); return; }
  const list = shuffle(pool.slice()).slice(0, 5);
  session = {queue: list, idx:0, retry:[], total:list.length, src:'read'};
  saveSession();
  renderCard();
}

/* 自测：只出「句子里的词你全都学过」的句子 */
function learnedSet(){
  const s = new Set();
  for(const w in S.data){ const st = S.data[w]; if(st && (st.ever || (st.s || 0) > 0 || st.copied)) s.add(w); }
  return s;
}
function testCandidates(){
  const known = learnedSet();
  return TEST_SENTENCES.filter(x=>x.need.every(n=>known.has(n)));
}
function startSelfTest(){
  const list = testCandidates();
  if(list.length < 4){ toast('学过的词还不够，先多背一些'); return; }
  session = {queue: shuffle(list.slice()).slice(0,10), idx:0, retry:[], total: Math.min(10, list.length), src:'test', answers:[]};
  saveSession();
  renderCard();
}

function startSession(randomMode, mode){
  const m = mode || 'core';
  let queue;
  if(m === 'extra'){
    queue = shuffle(deckWords().filter(x=>!S.data[x.w])).slice(0, 5);
    if(!queue.length){ popBadge(false); return; }
  } else {
    const due = dueList();
    let news;
    if(randomMode){
      // 自由练习：优先抽「到期 / 快到期」，再补最弱的词；跳过 1 小时内看过的
      const nowT = Date.now();
      const seenRecent = (w)=>{ const st = S.data[w] || {}; return st.lastAt && (nowT - st.lastAt) < 60*60000; };
      const near = deckWords().filter(x=>{ const st = S.data[x.w]; return st && st.due && st.due <= nowT + 24*3600*1000; });
      let pool = near.filter(x=>!seenRecent(x.w));
      if(pool.length < 5) pool = near.slice();
      if(pool.length < 5){
        const have = new Set(pool.map(x=>x.w));
        const weak = deckWords()
          .filter(x=>{ const st = S.data[x.w]; return st && !have.has(x.w) && !seenRecent(x.w); })
          .sort((a,b)=>(((S.data[a.w]||{}).s||0) - ((S.data[b.w]||{}).s||0)));
        pool = pool.concat(weak);
      }
      news = shuffle(pool).slice(0, 20);
    } else {
      news = newList();
    }
    // 主学习只出新词；到期的词走「记忆曲线复习」按钮
    queue = shuffle(news);
    if(!queue.length) queue = shuffle(deckWords().slice()).slice(0,20);
  }
  if(!queue.length){ alert('词库是空的'); return; }
  session = {queue, idx:0, retry:[], total:queue.length, src: m};
  saveSession();
  renderCard();
}

function pickType(word, st){
  const seen = st ? st.s : 0;
  if(seen === 0) return 'zh2en';        // 新词走 learn/copy，不会直接到这里
  if(seen <= 1) return (word.e ? 'blank' : 'zh2en');
  if(seen === 2) return 'zh2en';
  return Math.random() < 0.5 ? 'listen' : 'blank';
}

function mark(right, item, typed){
  const fb = $("#fb");
  const st = ensure(item.w);
  st.ok += right?1:0; st.bad += right?0:1;
  S.ok += right?1:0; S.bad += right?0:1;

  // 只记录“最近一次看到”，不覆盖“哪天学的”
  st.lastAt = Date.now();
  if(right){
    if(st.s === 0){
      // 新词通过一次：进入 1 级，明天复习；这时才算“今天学过”
      st.s = 1;
      st.day = todayStr();
      st.ever = 1;              // 历史标记：这个词学过一遍（永不回退）
      st.due = dueAfterDays(1);
    } else if(Date.now() < (st.due || 0) - 3600000){
      // 没到期就复习（提前刷）：不升级；到期时间每天只顺延一次，避免反复刷把复习推远
      st.early = (st.early || 0) + 1;
      if(st.earlyDay !== todayStr()){
        st.earlyDay = todayStr();
        st.due = Math.max(st.due || 0, Date.now() + 6*3600000);
      }
    } else if(st.upDay === todayStr()){
      // 今天已经升过一次了：再答对也不升，避免狂刷
      st.early = (st.early || 0) + 1;
    } else {
      st.s = Math.min(MASTER_STAGE, st.s + 1);
      st.upDay = todayStr();
      const base = (INTERVALS[Math.min(st.s-1, INTERVALS.length-1)]||1);
      const days = Math.max(1, Math.round(base * ((st.ef || 2.5) / 2.5)));
      st.due = dueAfterDays(days);
    }
  } else {
    // 答错：熟练词（2 级以上）当天补考，生词留到明天；同时把它标难一点
    const wasLevel = st.s || 0;
    st.s = Math.max(0, st.s - 1);
    st.ef = Math.max(1.3, (st.ef || 2.5) - 0.25);
    st.due = wasLevel >= 2 ? (Date.now() + 2 * 3600000) : dueAfterDays(1);
  }
  if(!st.counted && !(session && session.review)){
    st.counted = true;
    if(S.dayNew.date !== todayStr()) S.dayNew = {date: todayStr(), n:0};
    S.dayNew.n++;
  }
  const t = todayStr();
  if(S.streak.last !== t){ S.streak.n = S.streak.last ? S.streak.n + 1 : 1; S.streak.last = t; }
  save();

  fb.className = 'fb ' + (right?'ok':'bad');
  fb.innerHTML = right
    ? `✅ <b>${esc(item.w)}</b> ${esc(item.p||'')} — ${esc(item.m)}${item.e?'<br><span style="opacity:.8">'+esc(item.e)+'</span>':''}`
    : `❌ 正确是 <b>${esc(item.w)}</b> ${esc(item.p||'')} — ${esc(item.m)}${item.e?'<br><span style="opacity:.8">'+esc(item.e)+'</span>':''}`;
  if(!right) session.retry.push(item);
  if(!right && typed) recordConfusion(item, typed);
  if(right){ sfxCorrect(); fireworks(3); popBadge(true); } else { sfxWrong(); popBadge(false); }
  speakItem(item);

  const nx = $("#next");
  nx.classList.remove('hide');
  nx.onclick = advanceSession;
  nx.focus();
}

/* 推进到下一张；整轮结束时若有答错的词，就开一轮重考 */
function advanceSession(){
  if(!session){ renderHome(); return; }
  session.idx++;
  // 跟读做完 5 个 → 记今天读过了
  if(session.src === 'read' && session.idx >= session.queue.length){
    S.readDate = todayStr();
    S.readCount = (S.readCount || 0) + 1;
    save();
  }
  if(session.idx >= session.queue.length && session.retry.length){
    session.queue = shuffle(session.retry.slice());
    session.retry = [];
    session.idx = 0;
    renderCard();
    return;
  }
  renderCard();
}

function renderSummary(){
  setBack(true);
  window.__AT_TOOL_HOME = false;
  const st = stats();
  const wasReview = session && session.review;
  // 睡前总复习：只要覆盖了今天全部的词，也算“今日回顾完成”（但不占 3 次配额）
  if(session && session.src === 'mixed' && (session.cover || []).length){
    S.reviewedDate = todayStr();
    S.firedAt = 0;
    save();
    toast('🌙 今天的词都过完了，早点睡');
  }
  // 自测：统计「词都认识但句子串不起来」的句子数
  if(session && session.src === 'test'){
    const ans = session.answers || [];
    const a = ans.filter(x=>x.ans==='A').length;
    const b = ans.filter(x=>x.ans==='B').length;
    const c = ans.filter(x=>x.ans==='C').length;
    S.testLog = {at: Date.now(), a, b, c, total: ans.length};
    save();
    let verdict, tone, advice;
    if(b >= 3){
      verdict = '可以开始学语法了';
      tone = '#3ddc97';
      advice = '有 ' + b + ' 句是「词都认识但串不起来」——这就是结构问题，学语法会对症。';
    } else if(b <= 1){
      verdict = '结构没问题，继续背词';
      tone = '#4ea8de';
      advice = '几乎没有「词认识但句子不懂」的情况，说明现在卡在词汇量，不是语法。';
    } else {
      verdict = '再观察一段时间';
      tone = '#ffc857';
      advice = '有一些句子串不起来，但还不算多，再背两周词再测一次。';
    }
    session = null;
    $("#view").innerHTML = `
      <h1>自测结果</h1>
      <div class="card" style="text-align:center">
        <div style="font-size:22px;color:${tone};margin-bottom:6px">${verdict}</div>
        <div class="muted" style="margin-bottom:10px">${advice}</div>
        <div class="row" style="justify-content:space-around;margin:14px 0">
          <div><div style="font-size:20px">${a}</div><div class="muted">完全不懂</div></div>
          <div><div style="font-size:20px;color:#ffc857">${b}</div><div class="muted">串不起来</div></div>
          <div><div style="font-size:20px;color:#3ddc97">${c}</div><div class="muted">看懂了</div></div>
        </div>
      </div>
      <button class="btn primary" id="back">返回</button>
    `;
    $("#back").onclick = renderHome;
    return;
  }
  // 易混组：按轮次推进（1→3→7→14 天），连对 4 轮就移除
  if(session && session.src === 'pair'){
    const PAIR_STEPS = [1, 3, 7, 14];
    const keys = new Set([...Object.keys(session.pairOk||{}), ...Object.keys(session.pairBad||{})]);
    for(const key of keys){
      const rec = (S.confuse || []).find(p=>{
        const k2 = p.a < p.b ? p.a + '|' + p.b : p.b + '|' + p.a;
        return k2 === key;
      });
      if(!rec) continue;
      if(session.pairBad[key]){
        rec.step = 0;
        rec.due = Date.now() + 2*3600000;   // 2 小时后还能再练
      } else if(session.pairOk[key]){
        rec.step = (rec.step || 0) + 1;
        if(rec.step >= 4){
          S.confuse = S.confuse.filter(p=>p !== rec);
        } else {
          rec.due = dueAfterDays(PAIR_STEPS[rec.step - 1]);
        }
      }
    }
    save();
  }
  if(!wasReview && !S.timerAt && (!session || session.src !== 'extra')){
    S.timerAt = Date.now() + 15 * 60000;
    S.studyAt = Date.now();
    save();
  }
  if(wasReview){
    if(S.reviewCountDay !== todayStr()){ S.reviewCountDay = todayStr(); S.reviewCount = 0; }
    S.reviewedDate = todayStr();
    S.reviewCount = (S.reviewCount || 0) + 1;
    S.lastReviewAt = Date.now();
    S.firedAt = 0;
    save();
  }
  clearSession();
  $("#view").innerHTML = `
    <h1>这一轮结束了</h1>
    <p class="sub">答错的已经重新排过队</p>
    <div class="grid" style="margin-top:10px">
      <div class="stat"><b>${session.total}</b><span>本轮词数</span></div>
      <div class="stat"><b>${st.mastered}</b><span>累计掌握</span></div>
      <div class="stat"><b>${st.acc}%</b><span>总正确率</span></div>
      <div class="stat"><b>${S.streak.n}</b><span>连续天数</span></div>
    </div>
    <button class="btn primary" id="home" style="margin-top:16px">回到首页</button>
  `;
  session = null;
  $("#home").onclick = renderHome;
}

function maybeNotify(){
  try{
    if(!S.notifyOn || !('Notification' in window) || Notification.permission !== 'granted') return;
    const tw = todayWords();
    if(!tw.length || S.reviewedDate === todayStr()) return;
    const d = new Date();
    const nowHM = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    if(nowHM < (S.remind||'21:30')) return;
    const k = 'vocab_notified_'+todayStr();
    if(localStorage.getItem(k)) return;
    localStorage.setItem(k,'1');
    new Notification('背单词', {body:'今天学的 '+tw.length+' 个词还没回顾，30 秒过一遍？', tag:'vocab-review'});
  }catch(e){}
}

function checkTimer(){
  if(!S.timerAt) return;
  if(S.reviewedDate === todayStr()){ S.timerAt = 0; save(); return; }
  if(Date.now() < S.timerAt) return;
  S.timerAt = 0;
  S.firedAt = Date.now();
  const k = 'vocab_t2_' + todayStr();
  const first = !localStorage.getItem(k);
  if(first) localStorage.setItem(k, '1');
  if(first && S.notifyOn && ('Notification' in window) && Notification.permission === 'granted'){
    try { new Notification('该复习第二遍了', { body: '15 分钟到了，2 分钟再过一遍今天的词？', tag: 'vocab-second' }); } catch(e){}
  }
  if(first) pushQQ('⏱ 15 分钟到了，该背第二遍了。\n开软件点「开始第二次复习」，2 分钟的事。');
  save();
  if(!session) renderHome();
}

});
document.addEventListener('keydown', ()=>{ ac(); }, { once: true });
// 演示用：?demo=1 立刻把“第二次复习”计时归零，便于预览提醒样式
try {
  const qs = new URLSearchParams(location.search);
  if (qs.get('demo') === '1') {
    S.timerAt = Date.now();
    S.reviewedDate = '';
  }
  // 调试种子：必须同时带 ?test=1，否则直接忽略，绝不碰真实数据
  if (qs.get('seed') === 'root' && IS_TESTMODE && KEY === 'vocab_test') {
    // 调试：造一个「长词 + 错 3 次」的词，用来看词根拆解
    const w = 'equipment';
    S.deck = 'all';
    S.data[w] = Object.assign({}, S.data[w] || {}, {s: 2, bad: 3, ok: 1, due: Date.now() - 1000, copied: 1, ever: 1});
    save();
    try { document.title = 'SEED ' + S.deck; } catch(e){}
    try { localStorage.removeItem(SESSION_KEY); } catch(e){}
    setTimeout(()=>{
      const item = allDeckWords().find(x=>x.w===w);
      if(!item) return;
      session = {queue: [item], idx:0, retry:[], total:1, src:'core'};
      saveSession();
      renderCard();
    }, 700);
  }
} catch (e) {}
migrateDayBoundary();
fixTodayWords();
backfillEver();
applyBg();
try{
  const tb = document.getElementById('testBadge');
  if(tb && IS_TESTMODE){
    tb.textContent = ' 测试模式';
    tb.style.cssText = 'margin-left:8px;font-size:11px;color:#ffc857;border:1px solid #5a4a1a;border-radius:6px;padding:1px 6px';
    document.body.style.filter = 'none';
  }
}catch(e){}
renderHome();
pullState();
maybeNotify();
checkTimer();
setInterval(()=>{ maybeNotify(); checkTimer(); }, 20000);
// 调试：?test=1 用 1 个词快速跑一整轮
try{
  const qsT = new URLSearchParams(location.search);
  if(qsT.get('test') === '1' && qsT.get('seed') !== 'root'){
    S = blank();
    S.goal = 1;
    S.dayNew = {date:'', n:0};
    S.timerAt = 0; S.studyAt = 0; S.firedAt = 0;
    clearSession(); save();
    setTimeout(()=> startSession(false), 80);
  }
}catch(e){}
document.addEventListener('keydown', e=>{
  if(e.defaultPrevented) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const nx = document.getElementById('next');
  if(nx && !nx.classList.contains('hide') && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); nx.click(); }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Control' && !e.repeat){
    const f = document.getElementById('forgot');
    if(f){ e.preventDefault(); f.click(); }
  }
  if(e.key === 'CapsLock' && !e.repeat){
    const b = document.getElementById('pronBtn');
    if(b){ e.preventDefault(); b.click(); }
  }
});
</script>
