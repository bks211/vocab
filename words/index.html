const KEY = (function(){
  try{ if(new URLSearchParams(location.search).get('test') === '1') return 'vocab_test'; }catch(e){}
  return 'vocab_v2';
})();

function blank(){ return {data:{}, custom:[], deck:'func', goal:10, streak:{last:'',n:0}, dayNew:{date:'',n:0}, ok:0, bad:0, reviewedDate:'', reviewCount:0, reviewCountDay:'', earlyReviewDate:'', remind:'21:30', notifyOn:false, timerAt:0, confuse:[]}; }
function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY));
    if(raw && typeof raw === 'object'){
      const b = blank();
      return Object.assign(b, raw, {streak: Object.assign(b.streak, raw.streak||{}), dayNew: Object.assign(b.dayNew, raw.dayNew||{})});
    }
  }catch(e){}
  return blank();
}
let S = load();
/* 一次性修正：旧版把“复习过”也标成“今天学的”，把这些清掉 */
function fixTodayWords(){
  if(S.migV4) return 0;
  const t = todayStr();
  const tom4 = dueAfterDays(1);
  let n = 0;
  for(const w in S.data){
    const st = S.data[w];
    if(!st || st.day !== t) continue;
    const looksNew = (st.s || 0) <= 1 && st.due && st.due <= tom4 + 3600000;
    if(!looksNew){ st.day = ''; n++; }
  }
  S.migV4 = true;
  save();
  return n;
}

/* 老数据补一个「学过」标记：有等级或抄写过的，都算学过 */
function backfillEver(){
  let n = 0;
  for(const w in S.data){
    const st = S.data[w];
    if(st && !st.ever && ((st.s || 0) > 0 || st.copied)){ st.ever = 1; n++; }
  }
  if(n) save();
  return n;
}

/* 某个词库的进度：passed=学过一遍（只增），current=当前还记着（≥3 级） */
function deckStats(key){

/* 编辑距离：判断“是不是把别的词拼成了这个词” */
function lev(a, b){
  a = String(a).toLowerCase(); b = String(b).toLowerCase();
  const m = a.length, n = b.length;
  const dp = [];
  for(let i=0;i<=m;i++){ dp[i] = [i]; }
  for(let j=1;j<=n;j++){ dp[0][j] = j; }
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
  }
  return dp[m][n];
}
/* 打错时：看看是不是拼成了另一个词，是的话记成易混淆对 */
function recordConfusion(item, typed){
  const t = String(typed || '').trim().toLowerCase();
  if(!t) return;
  const pool = deckWords().filter(x=>x.w !== item.w);
  let best = null, bestD = 99;
  for(const x of pool){
    const d = lev(t, x.w);
    if(d < bestD){ bestD = d; best = x; }
  }
  if(!best || bestD > 2) return;
  if(lev(t, item.w) <= bestD) return;   // 不是拼成别的词，只是拼错
  const keyA = item.w, keyB = best.w;
  const list = S.confuse || (S.confuse = []);
  if(!list.some(p=>(p.a===keyA && p.b===keyB) || (p.a===keyB && p.b===keyA))){
    list.push({a:keyA, b:keyB, at:Date.now()});
    save();
    toast('⚠️ 记下了易混：' + keyA + ' / ' + keyB);
  }
}

function tone(freq, start, dur, type, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.linearRampToValueAtTime(vol || 0.16, c.currentTime + start + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
}

/* 生成 WAV 并用 <audio> 播放：比 Web Audio 兼容性更好（file:// 下也能出声） */
function renderTones(notes, sr, dur){
  const n = Math.floor(sr * dur);
  const a = new Float32Array(n);
  for(const nt of notes){
    const st = Math.floor(nt.t * sr);
    const len = Math.floor(nt.d * sr);
    for(let i = 0; i < len && st + i < n; i++){
      const tt = i / sr;
      const env = Math.min(1, tt / 0.008) * Math.exp(-tt * 5.5);
      let s = Math.sin(2*Math.PI*nt.f*tt);
      if(nt.h) s += 0.35 * Math.sin(4*Math.PI*nt.f*tt);
      a[st + i] += s * env * (nt.v || 0.3);
    }
  }
  return a;
}
function wavDataUri(samples, sr){
  const len = samples.length;
  const buf = new ArrayBuffer(44 + len*2);
  const v = new DataView(buf);
  const wr = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  wr(0,'RIFF'); v.setUint32(4, 36 + len*2, true); wr(8,'WAVE'); wr(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  wr(36,'data'); v.setUint32(40, len*2, true);
  for(let i=0;i<len;i++){
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i*2, s*32767, true);
  }
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}

let FW = null;
function fwInit(){
  if(FW) return FW;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  document.body.appendChild(c);
  const fit = ()=>{ c.width = innerWidth; c.height = innerHeight; };
  fit(); window.addEventListener('resize', fit);
  FW = {c, ctx: c.getContext('2d'), parts: [], raf: 0};
  return FW;
}
function fireworks(n){
  const f = fwInit();
  const W = f.c.width, H = f.c.height;
  for(let k=0; k<(n||3); k++){
    const x = W * (0.18 + Math.random()*0.64);
    const y = H * (0.18 + Math.random()*0.34);
    const hue = Math.floor(Math.random()*360);
    const cnt = 44;
    for(let i=0;i<cnt;i++){
      const a = (Math.PI*2*i)/cnt + Math.random()*0.18;
      const sp = 2.0 + Math.random()*3.0;
      f.parts.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, hue: hue + Math.random()*40});
    }
  }
  if(!f.raf) f.raf = requestAnimationFrame(fwTick);
}
function fwTick(){
  const f = FW; if(!f) return;
  const {ctx, c} = f;
  ctx.clearRect(0, 0, c.width, c.height);
  f.parts = f.parts.filter(p=>p.life > 0);
  for(const p of f.parts){
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.986; p.vy *= 0.986; p.life -= 0.011;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue},100%,${58 + p.life*22}%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.4 * Math.max(0.25, p.life), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(f.parts.length) f.raf = requestAnimationFrame(fwTick);
  else { ctx.clearRect(0,0,c.width,c.height); f.raf = 0; }
}

function todayWords(){ return allDeckWords().filter(x=>{ const st=S.data[x.w]; return st && st.day === todayStr(); }); }
/* 只算「今日必学」的词（额外学的另算） */
function todayCoreWords(){
  return todayWords().filter(x=>{ const st=S.data[x.w]; return st && st.src !== 'extra'; });
}

/* 词根拆解：只在「长词 + 错过 ≥3 次」时给 */
function rootInfoOf(item, data){
  if(!item || !item.w) return null;
  if(item.w.replace(/[^a-zA-Z]/g,'').length < 6) return null;
  if(!data || (data.bad || 0) < 3) return null;
  return ROOTS[item.w.toLowerCase()] || null;
}
function rootPanelHtml(info){
  if(!info) return '';
  const parts = (info.parts || []).map(p=>`<b>${esc(p[0])}</b>（${esc(p[1])}）`).join(' + ');
  return `<div style="text-align:left;line-height:1.9">
    <div><span style="color:#8b96a4">词性</span> ${esc(info.pos || '—')}</div>
    ${parts ? `<div><span style="color:#8b96a4">拆解</span> ${parts}</div>` : ''}
    ${info.family && info.family.length ? `<div><span style="color:#8b96a4">同族</span> ${info.family.map(esc).join(' / ')}</div>` : ''}
    ${info.colloc ? `<div><span style="color:#8b96a4">搭配</span> ${esc(info.colloc)}</div>` : ''}
    ${info.hook ? `<div style="margin-top:6px;color:#ffc857">记：${esc(info.hook)}</div>` : ''}
  </div>`;
}

function startReview(){
  const cntToday = (S.reviewCountDay === todayStr()) ? (S.reviewCount || 0) : 0;
  if(cntToday >= 3) return;
  // 第一次回顾：今天学的词一个不落全考（这是学习步骤，不能筛）
  // 之后的回顾：跳过 10 分钟内刚看过的，避免靠短期记忆
  const firstRound = cntToday === 0;
  const now = Date.now();
  let pool = todayCoreWords().filter(x=>{
    if(firstRound) return true;
    const st = S.data[x.w] || {};
    return !st.lastAt || (now - st.lastAt) >= 10*60000;
  });
  if(pool.length < 3) pool = todayCoreWords();
  // 一次回顾最多考「每日目标」那么多，超出的分到下一轮
  const cap = Math.max(5, S.goal || 10);
  const list = shuffle(pool.slice()).slice(0, cap);
  if(!list.length) return;
  session = {queue:list, idx:0, retry:[], total:list.length, review:true};
  renderCard();
}

/* ===== 中途退出：把没背完的队列存起来，下次接着来 ===== */
const SESSION_KEY = KEY + '_session';
function saveSession(){
  try{
    if(!session){ localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      queue: session.queue.map(x=>x.w),
      idx: session.idx,
      retry: session.retry.map(x=>x.w),
      review: !!session.review,
      total: session.total,
      at: Date.now()
    }));
  }catch(e){}
}
function loadSession(){
  try{
    const o = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(!o || !Array.isArray(o.queue) || !o.queue.length) return null;
    if(Date.now() - (o.at||0) > 6*3600*1000) return null;   // 超过 6 小时就当过期
    const map = new Map(deckWords().map(x=>[x.w, x]));
    const q = o.queue.map(w=>map.get(w)).filter(Boolean);
    if(!q.length) return null;
    return {
      queue: q,
      idx: Math.min(o.idx||0, q.length),
      retry: (o.retry||[]).map(w=>map.get(w)).filter(Boolean),
      review: !!o.review,
      total: o.total || q.length
    };
  }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function startDueReview(){
  const due = shuffle(dueList().slice());
  if(!due.length) return;
  session = {queue: due, idx:0, retry:[], total:due.length, src:'due'};
  saveSession();
  renderCard();
}

function startMixedReview(){
  const seen = new Set(); const q = [];
  const todayList = todayCoreWords();
  for(const x of todayList){ if(!seen.has(x.w)){ seen.add(x.w); q.push(x); } }
  for(const x of dueList()){ if(!seen.has(x.w)){ seen.add(x.w); q.push(x); } }
  if(!q.length) return;
  session = {queue: shuffle(q), idx:0, retry:[], total:q.length, src:'mixed', cover: todayList.map(x=>x.w)};
  saveSession();
  renderCard();
}

function startPairDrill(){
  const now = Date.now();
  const pairs = (S.confuse || []).filter(p=>!p.due || p.due <= now);
  if(!pairs.length) return;
  const map = new Map(deckWords().map(x=>[x.w, x]));
  const cards = [];
  for(const pr of pairs){
    const A = map.get(pr.a), B = map.get(pr.b);
    if(!A || !B) continue;
    const key = pr.a < pr.b ? pr.a + '|' + pr.b : pr.b + '|' + pr.a;
    cards.push(Object.assign({}, A, {__pair:{other:B.w, otherM:B.m, key}}));
    cards.push(Object.assign({}, B, {__pair:{other:A.w, otherM:A.m, key}}));
  }
  if(!cards.length) return;
  session = {queue: shuffle(cards), idx:0, retry:[], total:cards.length, src:'pair', pairOk:{}, pairBad:{}};
  saveSession();
  renderCard();
}

/* 导入/导出词库：给朋友做的词表，粘 JSON 或选文件都能用 */
function openDeckImport(){
  const d = document.createElement('div');
  d.id = 'impMask';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = `<div class="card" style="max-width:520px;width:100%;max-height:82vh;overflow:auto;margin:0">
    <b>导入词库</b>
    <p class="muted" style="margin:6px 0 10px">把别人给你的 JSON 粘进来，或选一个 .json 文件。<br>格式：[{w:"word", m:"释义", e:"例句"}]</p>
    <textarea id="impText" style="width:100%;height:150px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f141a;color:var(--fg);font-size:15px;font-family:inherit" placeholder="粘贴 JSON…"></textarea>
    <input type="file" id="impFile" accept=".json,application/json" style="margin-top:10px;color:var(--dim)">
    <div class="fb" id="impFb" style="display:none"></div>
    <button class="btn primary" id="impGo">导入</button>
    <button class="btn ghost" id="impCancel">取消</button>
  </div>`;
  document.body.appendChild(d);
  const close = ()=> d.remove();
  d.onclick = (e)=>{ if(e.target === d) close(); };
  $("#impCancel").onclick = close;
  $("#impFile").onchange = ()=>{
    const f = $("#impFile").files && $("#impFile").files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ $("#impText").value = String(r.result || ''); };
    r.readAsText(f, 'utf-8');
  };
  $("#impGo").onclick = ()=>{
    const fb = $("#impFb");
    fb.style.display = 'block';
    const raw = ($("#impText").value || '').trim();
    if(!raw){ fb.className = 'fb bad'; fb.textContent = '先粘一段 JSON 或选文件'; return; }
    let data;
    try{ data = JSON.parse(raw); }catch(e){ fb.className = 'fb bad'; fb.textContent = 'JSON 格式不对：' + e.message; return; }
    let name = '导入词库';
    if(data && !Array.isArray(data) && Array.isArray(data.words)){ name = data.name || name; data = data.words; }
    if(!Array.isArray(data)){ fb.className = 'fb bad'; fb.textContent = '需要一个数组，或 {name, words:[...]}'; return; }
    const list = [];
    const seen = new Set();
    for(const x of data){
      if(!x || !x.w) continue;
      const w = String(x.w).trim();
      if(!w || seen.has(w.toLowerCase())) continue;
      seen.add(w.toLowerCase());
      list.push({w, p: x.p || '', m: x.m || '', e: x.e || ''});
    }
    if(!list.length){ fb.className = 'fb bad'; fb.textContent = '没解析出词条（每条至少要有 w 和 m）'; return; }
    S.imported = {name, list, at: Date.now()};
    S.deck = 'imported';
    save();
    close();
    renderSettings();
    toast('📥 导入成功：' + name + '（' + list.length + ' 词）');
  };
}

/* 自测：只出「句子里的词你全都学过」的句子 */
function learnedSet(){
  const s = new Set();
  for(const w in S.data){ const st = S.data[w]; if(st && (st.ever || (st.s || 0) > 0 || st.copied)) s.add(w); }
  return s;
}
function testCandidates(){
  const known = learnedSet();
  return TEST_SENTENCES.filter(x=>x.need.every(n=>known.has(n)));
}
function startSelfTest(){
  const list = testCandidates();
  if(list.length < 4){ toast('学过的词还不够，先多背一些'); return; }
  session = {queue: shuffle(list.slice()).slice(0,10), idx:0, retry:[], total: Math.min(10, list.length), src:'test', answers:[]};
  saveSession();
  renderCard();
}

function startSession(randomMode, mode){
  const m = mode || 'core';
  let queue;
  if(m === 'extra'){
    queue = shuffle(deckWords().filter(x=>!S.data[x.w])).slice(0, 5);
    if(!queue.length){ popBadge(false); return; }
  } else {
    const due = dueList();
    let news;
    if(randomMode){
      // 自由练习：优先抽「到期 / 快到期」，再补最弱的词；跳过 1 小时内看过的
      const nowT = Date.now();
      const seenRecent = (w)=>{ const st = S.data[w] || {}; return st.lastAt && (nowT - st.lastAt) < 60*60000; };
      const near = deckWords().filter(x=>{ const st = S.data[x.w]; return st && st.due && st.due <= nowT + 24*3600*1000; });
      let pool = near.filter(x=>!seenRecent(x.w));
      if(pool.length < 5) pool = near.slice();
      if(pool.length < 5){
        const have = new Set(pool.map(x=>x.w));
        const weak = deckWords()
          .filter(x=>{ const st = S.data[x.w]; return st && !have.has(x.w) && !seenRecent(x.w); })
          .sort((a,b)=>(((S.data[a.w]||{}).s||0) - ((S.data[b.w]||{}).s||0)));
        pool = pool.concat(weak);
      }
      news = shuffle(pool).slice(0, 20);
    } else {
      news = newList();
    }
    // 主学习只出新词；到期的词走「记忆曲线复习」按钮
    queue = shuffle(news);
    if(!queue.length) queue = shuffle(deckWords().slice()).slice(0,20);
  }
  if(!queue.length){ alert('词库是空的'); return; }
  session = {queue, idx:0, retry:[], total:queue.length, src: m};
  saveSession();
  renderCard();
}

function pickType(word, st){
  const seen = st ? st.s : 0;
  if(seen === 0) return 'zh2en';        // 新词走 learn/copy，不会直接到这里
  if(seen <= 1) return (word.e ? 'blank' : 'zh2en');
  if(seen === 2) return 'zh2en';
  return Math.random() < 0.5 ? 'listen' : 'blank';
}

function renderCard(){
  setBack(true);
  if(!session){ renderHome(); return; }
  if(session.idx >= session.queue.length){ return renderSummary(); }
  if(optKeys){ document.removeEventListener('keydown', optKeys); optKeys = null; }
  const item = session.queue[session.idx];
  const data = S.data[item.w];
  const showHint = !!(data && (data.bad || 0) > 0);
  let type;
  if(item.__match) type = 'match';
  else if(item.__pair) type = 'pair';
  else if(!data) type = 'learn';
  else if(data.s === 0 && !data.copied) type = 'copy';
  else if(data.s === 0) type = 'zh2en';
  else type = pickType(item, data);
  // 发音存疑专场：只听音拼写，练耳朵
  if(session && session.src === 'pron') type = 'listen';
  // 跟读专场：只读不打
  if(session && session.src === 'read') type = 'read';
  // 自测专场：只看句子选状态
  if(session && session.src === 'test') type = 'test';
  const st = data || {s:0};
  session.current = {item, type};
  saveSession();
  // 键盘：空格=读一遍，回车=提交/下一个
  const bindKeys = (input, submit)=>{
    input.onkeydown = (e)=>{
      // 只有「单词本身没有空格」时，空格才用来发音；短语要把空格让出来
      if(item.w.indexOf(' ') < 0 && (e.key === ' ' || e.code === 'Space')){ e.preventDefault(); speakItem(item); return; }
      if(e.key === 'Enter'){
        e.preventDefault();
        const nx = document.getElementById('next');
        if(nx && !nx.classList.contains('hide')){ nx.click(); return; }
        submit();
      }
    };
  };

  const pct = Math.round(session.idx / session.queue.length * 100);
  let body = '';

  if(type === 'test'){
    body = `
      <div class="muted" style="margin-bottom:10px">${esc(item.tag || '句子')} · 不用查词典</div>
      <div style="font-size:19px;line-height:1.7;text-align:left">${esc(item.en)}</div>
      <div class="muted" style="margin:12px 0 4px">这句你读得怎么样？</div>
      <button class="opt" data-t="A" style="text-align:left">A. 完全不懂</button>
      <button class="opt" data-t="B" style="text-align:left">B. 每个词都认识，但整句串不起来</button>
      <button class="opt" data-t="C" style="text-align:left">C. 看懂了</button>
    `;
  } else if(type === 'read'){
    body = `
      <div class="muted" style="margin-bottom:10px">跟着读一遍（不用打，出声就行）</div>
      <div class="big">${esc(item.w)} <button class="spk" data-say="${esc(item.w)}">🔊</button></div>
      <div class="muted" style="margin:4px 0 8px">${esc(item.p || '')}</div>
      <div style="font-size:18px">${esc(item.m)}</div>
      <button class="btn primary" id="readDone" style="margin-top:16px">读完了，下一个</button>
    `;
  } else if(type === 'pair'){
    const opts = shuffle([item.w, item.__pair.other]);
    body = `
      <div class="muted" style="margin-bottom:10px">选出「${esc(item.m)}」对应的英文</div>
      ${opts.map((w,i)=>`<button class="opt" data-ans="${esc(w)}" style="font-size:19px">${'AB'[i]}. ${esc(w)}</button>`).join('')}
      <div class="muted" style="margin-top:12px">这两个词你混过，看清楚了</div>
    `;
  } else if(type === 'match'){
    const pool = shuffle(deckWords().filter(x=>x.w !== item.w && x.m !== item.m)).slice(0,3);
    const opts = shuffle([item, ...pool]);
    body = `
      <div class="muted" style="margin-bottom:10px">选出正确的中文意思</div>
      <div class="big">${esc(item.w)} <button class="spk" data-say="${esc(item.w)}">🔊</button></div>
      <div class="muted" style="margin:4px 0 12px">${esc(item.p||'')}</div>
      ${opts.map((o,i)=>`<button class="opt" data-ans="${esc(o.w)}">${'ABCD'[i]}. ${esc(o.m)}</button>`).join('')}
    `;
  } else if(type === 'learn'){
    body = `
      <div class="muted" style="margin-bottom:10px">新词 · 先看一眼，别急着记</div>
      <div class="big">${esc(item.w)} <button class="spk" data-say="${esc(item.w)}">🔊</button></div>
      <div class="muted" style="margin:4px 0 10px">${esc(item.p||'')}</div>
      <div style="font-size:18px;margin-bottom:10px">${esc(item.m)}</div>
      ${item.e?`<div class="muted" style="border-left:2px solid #2b3540;padding-left:10px">${esc(item.e)}</div>`:''}
      <button class="btn primary" id="learnNext" style="margin-top:14px">记住了 · 现在打一遍</button>
    `;
  } else if(type === 'copy'){
    body = `
      <div class="muted" style="margin-bottom:10px">词已经挡住了 — 凭记忆打一遍</div>
      <div class="big" style="font-size:22px">${esc(item.m)}</div>
      <div class="muted" style="margin:4px 0 12px">${esc(item.p||'')} · ${item.w.replace(/ /g,'').length} 个字母 <button class="spk" data-say="${esc(item.w)}" style="font-size:15px">🔊 听一下</button></div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="凭印象写出来">
      <button class="btn primary" id="submit" style="margin-top:12px">写好了</button>
    `;
  } else if(type === 'en2zh'){
    const others = shuffle(deckWords().filter(x=>x.w!==item.w)).slice(0,3);
    const opts = shuffle([item, ...others]);
    body = `
      <div class="big">${esc(item.w)} <button class="spk" data-say="${esc(item.w)}">🔊</button></div>
      <div class="muted" style="margin-bottom:6px">${esc(item.p||'')}</div>
      ${opts.map((o,i)=>`<button class="opt" data-ans="${esc(o.w)}">${'ABCD'[i]}. ${esc(o.m)}</button>`).join('')}
    `;
  } else if(type === 'zh2en'){
    body = `
      <div class="big" style="font-size:22px">${esc(item.m)}</div>
      <div class="muted" style="margin:6px 0 12px">输入英文${showHint ? ' · 首字母 '+esc(item.w[0])+' · '+item.w.replace(/ /g,'').length+' 个字母' : ''}</div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文">
      <button class="btn primary" id="submit" style="margin-top:12px">确认</button>
    `;
  } else if(type === 'blank' && item.e){
    const blanked = item.e.replace(new RegExp('\\b'+item.w.split(' ')[0]+'\\w*','i'), '______');
    body = `
      <div class="big" style="font-size:19px;line-height:1.55">${esc(blanked)}</div>
      <div class="muted" style="margin:8px 0 12px">${esc(item.m)}${showHint ? ' · 首字母 '+esc(item.w[0]) : ''}</div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="填入这个词">
      <button class="btn primary" id="submit" style="margin-top:12px">确认</button>
    `;
  } else {
    body = `
      <div class="center" style="padding:10px 0">
        <button class="btn" id="play" style="font-size:20px">🔊 点这里听发音</button>
      </div>
      <div class="muted center" style="margin:8px 0 12px">${esc(item.m)}</div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="听写：输入你听到的词">
      <button class="btn primary" id="submit" style="margin-top:12px">确认</button>
    `;
  }

  $("#view").innerHTML = `
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row" style="margin-bottom:14px">
      <span class="tag">${session.idx+1} / ${session.queue.length}</span>
      <span class="muted">${type==='en2zh'?'选意思':type==='zh2en'?'背拼写':type==='blank'?'例句填空':type==='learn'?'认识新词':type==='copy'?'照着打一遍':type==='match'?'选中文':'听音拼写'}</span>
    </div>
    <div class="card">${body}</div>
    ${rootInfoOf(item, data) ? `<button class="btn ghost" id="rootBtn" style="font-size:14px;padding:10px">🔍 拆解这个词</button>` : ''}
    ${(type!=='test' && type!=='read') ? `<button class="btn ghost" id="pronBtn" style="font-size:14px;padding:10px;color:#ffc857">🔈 读不准，先记下（CapsLock）</button>` : ''}
    ${(type==='en2zh'||type==='zh2en'||type==='blank'||type==='listen')
      ? `<button class="btn ghost" id="forgot" style="color:#ff8a8a;border-color:#3a2020">忘记了（Ctrl）</button>` : ''}
    <div class="fb" id="fb"></div>
    <button class="btn ghost hide" id="next">下一个 →</button>
  `;

  document.querySelectorAll('[data-say]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); speakItem(item); });
  if($("#play")) $("#play").onclick = ()=> speakItem(item);
  if(type === 'test'){
    document.querySelectorAll('[data-t]').forEach(b=>{
      b.onclick = ()=>{
        document.querySelectorAll('[data-t]').forEach(x=> x.disabled = true);
        b.classList.add('ok');
        session.answers.push({tag: item.tag, ans: b.dataset.t, en: item.en});
        setTimeout(()=> advanceSession(), 180);
      };
    });
    return;
  }
  if(type === 'read'){
    const rb = $("#readDone");
    if(rb) rb.onclick = ()=>{ speakItem(item); advanceSession(); };
    setTimeout(()=>{ try{ speakItem(item); }catch(e){} }, 200);
    return;
  }
  if($("#pronBtn")) $("#pronBtn").onclick = ()=>{
    const st2 = ensure(item.w);
    st2.pron = (st2.pron || 0) + 1;
    save();
    speakItem(item);
    toast('🔈 记下了：这个词的发音要再听');
  };
  if($("#rootBtn")) $("#rootBtn").onclick = ()=>{
    const info = rootInfoOf(item, data);
    if(!info) return;
    const fb = $("#fb");
    fb.className = 'fb ok';
    fb.innerHTML = `🔍 <b>${esc(item.w)}</b>` + rootPanelHtml(info);
  };

  if(type === 'pair'){
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick = ()=>{
        const right = b.dataset.ans === item.w;
        document.querySelectorAll('.opt').forEach(x=> x.disabled = true);
        b.classList.add(right?'ok':'bad');
        if(!right) document.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.ans===item.w) x.classList.add('ok'); });
        const st2 = ensure(item.w);
        const k = item.__pair.key;
        if(right){
          st2.ok++; S.ok++; sfxCorrect(); fireworks(2); popBadge(true);
          session.pairOk[k] = 1;
        } else {
          st2.bad++; S.bad++; sfxWrong(); popBadge(false); session.retry.push(item);
          session.pairBad[k] = 1;
          // 答错：两边都降一级，尽快回到复习里
          const otherSt = ensure(item.__pair.other);
          st2.s = Math.max(0, (st2.s || 0) - 1);
          st2.ef = Math.max(1.3, (st2.ef || 2.5) - 0.2);
          st2.due = dueAfterDays(1);
          otherSt.s = Math.max(0, (otherSt.s || 0) - 1);
          otherSt.ef = Math.max(1.3, (otherSt.ef || 2.5) - 0.2);
          otherSt.due = dueAfterDays(1);
        }
        save();
        const fb = $("#fb");
        fb.className = 'fb ' + (right?'ok':'bad');
        fb.innerHTML = right
          ? `✅ <b>${esc(item.w)}</b> — ${esc(item.m)}<br><span style="opacity:.8">另一个：${esc(item.__pair.other)} — ${esc(item.__pair.otherM)}</span>`
          : `❌ 「${esc(item.m)}」是 <b>${esc(item.w)}</b><br><span style="opacity:.8">你选的 ${esc(item.__pair.other)} 是「${esc(item.__pair.otherM)}」</span>`;
        speakItem(item);
        const nx = $("#next");
        nx.classList.remove('hide');
        nx.onclick = advanceSession;
        nx.focus();
      };
    });
    bindOptions();
    return;
  }

  if(type === 'match'){
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick = ()=>{
        const right = b.dataset.ans === item.w;
        document.querySelectorAll('.opt').forEach(x=> x.disabled = true);
        b.classList.add(right?'ok':'bad');
        if(!right) document.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.ans===item.w) x.classList.add('ok'); });
        const st2 = ensure(item.w);
        if(right){ st2.ok++; S.ok++; sfxCorrect(); fireworks(2); popBadge(true); }
        else { st2.bad++; S.bad++; st2.s = Math.max(0, st2.s - 1); sfxWrong(); popBadge(false); session.retry.push(item); }
        const t0 = todayStr();
        if(S.streak.last !== t0){ S.streak.n = S.streak.last ? S.streak.n + 1 : 1; S.streak.last = t0; }
        save();
        const fb = $("#fb");
        fb.className = 'fb ' + (right?'ok':'bad');
        fb.innerHTML = right
          ? `✅ <b>${esc(item.w)}</b> — ${esc(item.m)}`
          : `❌ 正确的意思是：<b>${esc(item.m)}</b>`;
        speakItem(item);
        const nx = $("#next");
        nx.classList.remove('hide');
        nx.onclick = advanceSession;
        nx.focus();
      };
    });
    bindOptions();
    return;
  }

  if(type === 'learn'){
    $("#learnNext").onclick = ()=>{ const s2 = ensure(item.w); s2.copied = 0; save(); renderCard(); };
    $("#learnNext").focus();
    return;
  }

  if(type === 'copy'){
    const input = $("#ans");
    input.focus();
    const go = ()=>{
      const v = (input.value||'').trim().toLowerCase();
      if(!v) return;
      const fb = $("#fb");
      if(v === item.w.toLowerCase()){
        input.disabled = true;
        const s2 = ensure(item.w);
        s2.copied = 1;
        s2.src = (session && session.src) || 'core';
        // 抄写完先标记为「待考」：万一这轮没做完，下次开始也会把它捡起来
        s2.due = Date.now();
        save();
        // 中英匹配题排到整轮最后，避免靠刚看过的短期记忆
        const m = Object.assign({}, item, {__match: true});
        session.queue.push(m);
        deferCard(item);
        fb.className = 'fb ok';
        fb.innerHTML = `✅ 拼写记下了 — 这个词对你多难？
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="opt" data-rate="2.9" style="margin-top:0;flex:1;text-align:center;padding:10px">简单</button>
            <button class="opt" data-rate="2.5" style="margin-top:0;flex:1;text-align:center;padding:10px">一般</button>
            <button class="opt" data-rate="1.7" style="margin-top:0;flex:1;text-align:center;padding:10px">难</button>
          </div>`;
        sfxCorrect();
        fireworks(2);
        popBadge(true);
        speakItem(item);
        document.querySelectorAll('[data-rate]').forEach(b=>{
          b.onclick = ()=>{
            s2.ef = Number(b.dataset.rate);
            save();
            advanceSession();
          };
        });
        bindOptions();
        return;
      } else {
        fb.className = 'fb bad';
        fb.innerHTML = `差一点：${diffHtml(item.w, v)}<br><span style="opacity:.8">看着正确的，再打一遍</span>`;
        input.value = '';
        input.focus();
        toast('🙂 先看一眼，再打');
      }
    };
    $("#submit").onclick = go;
    bindKeys(input, go);
    return;
  }

  if($("#forgot")) $("#forgot").onclick = ()=>{
    const inp = $("#ans");
    if(inp) inp.disabled = true;
    document.querySelectorAll('.opt').forEach(x=>{
      x.disabled = true;
      if(x.dataset && x.dataset.ans === item.w) x.classList.add('ok');
    });
    mark(false, item);
  };

  if(type === 'en2zh'){
    document.querySelectorAll('.opt').forEach(b=>{
      b.onclick = ()=>{
        const right = b.dataset.ans === item.w;
        document.querySelectorAll('.opt').forEach(x=> x.disabled = true);
        b.classList.add(right?'ok':'bad');
        if(!right) document.querySelectorAll('.opt').forEach(x=>{ if(x.dataset.ans===item.w) x.classList.add('ok'); });
        mark(right, item);
      };
    });
    bindOptions();
  } else {
    const input = $("#ans");
    input.focus();
    const go = ()=>{
      const v = (input.value||'').trim().toLowerCase();
      if(!v) return;
      const right = v === item.w.toLowerCase();
      input.disabled = true;
      mark(right, item, v);
    };
    $("#submit").onclick = go;
    bindKeys(input, go);
  }
}

function mark(right, item, typed){
  const fb = $("#fb");
  const st = ensure(item.w);
  st.ok += right?1:0; st.bad += right?0:1;
  S.ok += right?1:0; S.bad += right?0:1;

  // 只记录“最近一次看到”，不覆盖“哪天学的”
  st.lastAt = Date.now();
  if(right){
    if(st.s === 0){
      // 新词通过一次：进入 1 级，明天复习；这时才算“今天学过”
      st.s = 1;
      st.day = todayStr();
      st.ever = 1;              // 历史标记：这个词学过一遍（永不回退）
      st.due = dueAfterDays(1);
    } else if(Date.now() < (st.due || 0) - 3600000){
      // 没到期就复习（提前刷）：不升级；到期时间每天只顺延一次，避免反复刷把复习推远
      st.early = (st.early || 0) + 1;
      if(st.earlyDay !== todayStr()){
        st.earlyDay = todayStr();
        st.due = Math.max(st.due || 0, Date.now() + 6*3600000);
      }
    } else if(st.upDay === todayStr()){
      // 今天已经升过一次了：再答对也不升，避免狂刷
      st.early = (st.early || 0) + 1;
    } else {
      st.s = Math.min(MASTER_STAGE, st.s + 1);
      st.upDay = todayStr();
      const base = (INTERVALS[Math.min(st.s-1, INTERVALS.length-1)]||1);
      const days = Math.max(1, Math.round(base * ((st.ef || 2.5) / 2.5)));
      st.due = dueAfterDays(days);
    }
  } else {
    // 答错：熟练词（2 级以上）当天补考，生词留到明天；同时把它标难一点
    const wasLevel = st.s || 0;
    st.s = Math.max(0, st.s - 1);
    st.ef = Math.max(1.3, (st.ef || 2.5) - 0.25);
    st.due = wasLevel >= 2 ? (Date.now() + 2 * 3600000) : dueAfterDays(1);
  }
  if(!st.counted && !(session && session.review)){
    st.counted = true;
    if(S.dayNew.date !== todayStr()) S.dayNew = {date: todayStr(), n:0};
    S.dayNew.n++;
  }
  const t = todayStr();
  if(S.streak.last !== t){ S.streak.n = S.streak.last ? S.streak.n + 1 : 1; S.streak.last = t; }
  save();

  fb.className = 'fb ' + (right?'ok':'bad');
  fb.innerHTML = right
    ? `✅ <b>${esc(item.w)}</b> ${esc(item.p||'')} — ${esc(item.m)}${item.e?'<br><span style="opacity:.8">'+esc(item.e)+'</span>':''}`
    : `❌ 正确是 <b>${esc(item.w)}</b> ${esc(item.p||'')} — ${esc(item.m)}${item.e?'<br><span style="opacity:.8">'+esc(item.e)+'</span>':''}`;
  if(!right) session.retry.push(item);
  if(!right && typed) recordConfusion(item, typed);
  if(right){ sfxCorrect(); fireworks(3); popBadge(true); } else { sfxWrong(); popBadge(false); }
  speakItem(item);

  const nx = $("#next");
  nx.classList.remove('hide');
  nx.onclick = advanceSession;
  nx.focus();
}

/* 推进到下一张；整轮结束时若有答错的词，就开一轮重考 */
function advanceSession(){
  if(!session){ renderHome(); return; }
  session.idx++;
  // 跟读做完 5 个 → 记今天读过了
  if(session.src === 'read' && session.idx >= session.queue.length){
    S.readDate = todayStr();
    S.readCount = (S.readCount || 0) + 1;
    save();
  }
  if(session.idx >= session.queue.length && session.retry.length){
    session.queue = shuffle(session.retry.slice());
    session.retry = [];
    session.idx = 0;
    renderCard();
    return;
  }
  renderCard();
}

function renderSummary(){
  setBack(true);
  const st = stats();
  const wasReview = session && session.review;
  // 睡前总复习：只要覆盖了今天全部的词，也算“今日回顾完成”（但不占 3 次配额）
  if(session && session.src === 'mixed' && (session.cover || []).length){
    S.reviewedDate = todayStr();
    S.firedAt = 0;
    save();
    toast('🌙 今天的词都过完了，早点睡');
  }
  // 自测：统计「词都认识但句子串不起来」的句子数
  if(session && session.src === 'test'){
    const ans = session.answers || [];
    const a = ans.filter(x=>x.ans==='A').length;
    const b = ans.filter(x=>x.ans==='B').length;
    const c = ans.filter(x=>x.ans==='C').length;
    S.testLog = {at: Date.now(), a, b, c, total: ans.length};
    save();
    let verdict, tone, advice;
    if(b >= 3){
      verdict = '可以开始学语法了';
      tone = '#3ddc97';
      advice = '有 ' + b + ' 句是「词都认识但串不起来」——这就是结构问题，学语法会对症。';
    } else if(b <= 1){
      verdict = '结构没问题，继续背词';
      tone = '#4ea8de';
      advice = '几乎没有「词认识但句子不懂」的情况，说明现在卡在词汇量，不是语法。';
    } else {
      verdict = '再观察一段时间';
      tone = '#ffc857';
      advice = '有一些句子串不起来，但还不算多，再背两周词再测一次。';
    }
    session = null;
    $("#view").innerHTML = `
      <h1>自测结果</h1>
      <div class="card" style="text-align:center">
        <div style="font-size:22px;color:${tone};margin-bottom:6px">${verdict}</div>
        <div class="muted" style="margin-bottom:10px">${advice}</div>
        <div class="row" style="justify-content:space-around;margin:14px 0">
          <div><div style="font-size:20px">${a}</div><div class="muted">完全不懂</div></div>
          <div><div style="font-size:20px;color:#ffc857">${b}</div><div class="muted">串不起来</div></div>
          <div><div style="font-size:20px;color:#3ddc97">${c}</div><div class="muted">看懂了</div></div>
        </div>
      </div>
      <button class="btn primary" id="back">返回</button>
    `;
    $("#back").onclick = renderHome;
    return;
  }
  // 易混组：按轮次推进（1→3→7→14 天），连对 4 轮就移除
  if(session && session.src === 'pair'){
    const PAIR_STEPS = [1, 3, 7, 14];
    const keys = new Set([...Object.keys(session.pairOk||{}), ...Object.keys(session.pairBad||{})]);
    for(const key of keys){
      const rec = (S.confuse || []).find(p=>{
        const k2 = p.a < p.b ? p.a + '|' + p.b : p.b + '|' + p.a;
        return k2 === key;
      });
      if(!rec) continue;
      if(session.pairBad[key]){
        rec.step = 0;
        rec.due = Date.now() + 2*3600000;   // 2 小时后还能再练
      } else if(session.pairOk[key]){
        rec.step = (rec.step || 0) + 1;
        if(rec.step >= 4){
          S.confuse = S.confuse.filter(p=>p !== rec);
        } else {
          rec.due = dueAfterDays(PAIR_STEPS[rec.step - 1]);
        }
      }
    }
    save();
  }
  if(!wasReview && !S.timerAt && (!session || session.src !== 'extra')){
    S.timerAt = Date.now() + 15 * 60000;
    S.studyAt = Date.now();
    save();
  }
  if(wasReview){
    if(S.reviewCountDay !== todayStr()){ S.reviewCountDay = todayStr(); S.reviewCount = 0; }
    S.reviewedDate = todayStr();
    S.reviewCount = (S.reviewCount || 0) + 1;
    S.lastReviewAt = Date.now();
    S.firedAt = 0;
    save();
  }
  clearSession();
  $("#view").innerHTML = `
    <h1>这一轮结束了</h1>
    <p class="sub">答错的已经重新排过队</p>
    <div class="grid" style="margin-top:10px">
      <div class="stat"><b>${session.total}</b><span>本轮词数</span></div>
      <div class="stat"><b>${st.mastered}</b><span>累计掌握</span></div>
      <div class="stat"><b>${st.acc}%</b><span>总正确率</span></div>
      <div class="stat"><b>${S.streak.n}</b><span>连续天数</span></div>
    </div>
    <button class="btn primary" id="home" style="margin-top:16px">回到首页</button>
  `;
  session = null;
  $("#home").onclick = renderHome;
}

  $("#view").innerHTML = `

      ${['func','all'].concat(S.imported && S.imported.list && S.imported.list.length ? ['imported'] : []).map(k=>`<button class="btn ${S.deck===k?'primary':''} sm" data-deck="${k}">${deckName(k)}</button>`).join('')}
    </div>
    ${(()=>{
      const ds = deckStats(S.deck);

      return `<div class="card" style="margin-top:12px">
        <div class="row"><b>${deckName(S.deck)} 进度</b><span class="tag">${finished ? '🎉 过完一遍' : pct + '%'}</span></div>

      </div>`;
    })()}

    <p class="sub" style="margin-top:22px">每天新词</p>
    <div class="grid3">
      ${NEW_OPTIONS.map(n=>`<button class="btn ${S.goal===n?'primary':''} sm" data-goal="${n}">${n}</button>`).join('')}
    </div>

    <p class="sub" style="margin-top:22px">提醒</p>
    <div class="card">
      <div class="row"><span>提醒时间</span>
        <input type="text" id="remind" value="${esc(S.remind||'21:30')}" style="width:96px;margin:0;text-align:center">
      </div>
      <div class="muted" style="margin-top:8px">过了这个时间还没回顾，首页会亮黄色提示。</div>

      <button class="btn sm" id="testSfx" style="margin-top:8px">🔊 测试音效和烟花（先点这里确认）</button>
      <button class="btn sm" id="bgPick" style="margin-top:8px">🖼 换背景图</button>
      ${S.bg ? '<button class="btn sm" id="bgClear" style="margin-top:8px">清除背景图</button>' : ''}
    </div>

    <div class="card" style="max-height:260px;overflow:auto">
      ${S.custom.length ? S.custom.map((x,i)=>`
        <div class="worditem">
          <div><b>${esc(x.w)}</b> <span class="muted">${esc(x.m)}</span></div>

    <button class="btn ghost" id="checkUpd">🔄 检查更新</button>
    ${(S.imported && S.imported.list && S.imported.list.length) ? `<button class="btn ghost" id="deckExport">📤 导出当前导入的词库（${S.imported.list.length} 词）</button>` : ''}

    <button class="btn" id="import">导入备份</button>
    <button class="btn ghost" id="reset" style="color:#ff8a8a">清空全部进度</button>
    <button class="btn primary" id="back" style="margin-top:14px">返回</button>
  `;
  document.querySelectorAll('[data-deck]').forEach(b=> b.onclick = ()=>{ S.deck = b.dataset.deck; save(); renderSettings(); });
  document.querySelectorAll('[data-goal]').forEach(b=> b.onclick = ()=>{ S.goal = Number(b.dataset.goal); save(); renderSettings(); });
  $("#remind").onchange = ()=>{
    const v = ($("#remind").value||'').trim();
    if(!/^\d{1,2}:\d{2}$/.test(v)){ alert('格式要像 21:30'); return; }
    S.remind = v; save(); alert('提醒时间已设为 '+v);
  };
  $("#testSfx").onclick = ()=>{
    ac();
    sfxCorrect(); fireworks(3); popBadge(true);
    setTimeout(()=>{ sfxWrong(); popBadge(false); }, 800);
  };
  $("#bgPick").onclick = ()=>{
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = ()=>{
      const f = inp.files && inp.files[0];
      if(!f) return;
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = ()=>{
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        S.bg = c.toDataURL('image/jpeg', 0.82);
        URL.revokeObjectURL(url);
        save();
        applyBg();
        renderSettings();
      };
      img.src = url;
    };
    inp.click();
  };
  if($("#bgClear")) $("#bgClear").onclick = ()=>{
    S.bg = '';
    save();
    applyBg();
    renderSettings();
  };
  $("#notify").onclick = async ()=>{
    if(S.notifyOn){ S.notifyOn = false; save(); renderSettings(); return; }
    if(!('Notification' in window)){ alert('这个浏览器不支持桌面通知'); return; }
    const p = await Notification.requestPermission();
    if(p === 'granted'){ S.notifyOn = true; save(); alert('已开启。到提醒时间、且软件开着时，会弹一条通知。'); }
    else { alert('没有拿到通知权限，可以在浏览器地址栏左边的小锁里打开'); }
    renderSettings();
  };
  document.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{
    const i = Number(b.dataset.del);
    const w = S.custom[i].w;
    if(!confirm('删除生词「'+w+'」？')) return;
    S.custom.splice(i,1);
    delete S.data[w];
    save(); renderSettings();
  });
  $("#fixLevel").onclick = ()=>{
    const t = todayStr();
    let n = 0;
    for(const w in S.data){
      const st = S.data[w];
      if(st && st.day === t && (st.s || 0) > 1){
        st.s = 1;
        st.due = Date.now() + 86400000;
        st.early = 0;
        n++;
      }
    }
    save();
    renderHome();
    const v = document.getElementById('view');
    if(v){ const tip = document.createElement('div'); tip.className='card'; tip.style.borderColor='#22533c'; tip.style.background='rgba(61,220,151,.08)'; tip.innerHTML='<b style="color:#9be9c4">已修正 ' + n + ' 个词的等级</b><div class="muted" style="margin-top:6px">全部压回 1 级，明天重新验证。</div>'; v.prepend(tip); }
  };
  $("#clearToday").onclick = ()=>{
    const t = todayStr();
    let n = 0;
    for(const w in S.data){
      if(S.data[w] && S.data[w].day === t){ delete S.data[w]; n++; }
    }
    S.dayNew = {date:'', n:0};
    S.reviewedDate = '';
    S.firedAt = 0; S.timerAt = 0; S.studyAt = 0; S.lastReviewAt = 0;
    S.reviewCount = 0; S.reviewCountDay = '';
    clearSession();
    save();
    renderHome();
    const v = document.getElementById('view');
    if(v){ const tip = document.createElement('div'); tip.className='card'; tip.style.borderColor='#22533c'; tip.style.background='rgba(61,220,151,.08)'; tip.innerHTML='<b style="color:#9be9c4">已清空 ' + n + ' 个今天的词</b><div class="muted" style="margin-top:6px">它们回到未学状态，明天重新开始。</div>'; v.prepend(tip); }
  };
  $("#resetDay").onclick = ()=>{
    S.dayNew = {date:'', n:0};
    S.reviewedDate = '';
    S.firedAt = 0;
    S.timerAt = 0;
    S.studyAt = 0;
    S.lastReviewAt = 0;
    clearSession();
    try{ localStorage.removeItem('vocab_notified_' + todayStr()); localStorage.removeItem('vocab_t2_' + todayStr()); }catch(e){}
    save();
    renderHome();
    const v = document.getElementById('view');
    if(v){ const tip = document.createElement('div'); tip.className='card'; tip.style.borderColor='#22533c'; tip.style.background='rgba(61,220,151,.08)'; tip.innerHTML='<b style="color:#9be9c4">今天的任务已重置</b><div class="muted" style="margin-top:6px">新词额度恢复，去背吧。</div>'; v.prepend(tip); }
  };
  if($("#deckImport")) $("#deckImport").onclick = openDeckImport;
  if($("#deckExport")) $("#deckExport").onclick = exportDeck;
  $("#export").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '背单词备份-'+todayStr()+'.json';
    a.click();
  };
  $("#import").onclick = ()=>{
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{ S = Object.assign(S, JSON.parse(r.result)); save(); alert('导入成功'); renderHome(); }
        catch(e){ alert('文件读不了'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $("#reset").onclick = ()=>{
    if(confirm('清空全部进度（含生词本）？不可撤销。')){
      S = blank(); save(); renderHome();
    }
  };
  $("#back").onclick = renderHome;
}

function maybeNotify(){
  try{
    if(!S.notifyOn || !('Notification' in window) || Notification.permission !== 'granted') return;
    const tw = todayWords();
    if(!tw.length || S.reviewedDate === todayStr()) return;
    const d = new Date();
    const nowHM = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    if(nowHM < (S.remind||'21:30')) return;
    const k = 'vocab_notified_'+todayStr();
    if(localStorage.getItem(k)) return;
    localStorage.setItem(k,'1');
    new Notification('背单词', {body:'今天学的 '+tw.length+' 个词还没回顾，30 秒过一遍？', tag:'vocab-review'});
  }catch(e){}
}

function checkTimer(){
  if(!S.timerAt) return;
  if(S.reviewedDate === todayStr()){ S.timerAt = 0; save(); return; }
  if(Date.now() < S.timerAt) return;
  S.timerAt = 0;
  S.firedAt = Date.now();
  const k = 'vocab_t2_' + todayStr();
  const first = !localStorage.getItem(k);
  if(first) localStorage.setItem(k, '1');
  if(first && S.notifyOn && ('Notification' in window) && Notification.permission === 'granted'){
    try { new Notification('该复习第二遍了', { body: '15 分钟到了，2 分钟再过一遍今天的词？', tag: 'vocab-second' }); } catch(e){}
  }
  if(first) pushQQ('⏱ 15 分钟到了，该背第二遍了。\n开软件点「开始第二次复习」，2 分钟的事。');
  save();
  if(!session) renderHome();
}

/* ============ 启动 ============ */
// 第一次点击/按键时解锁音频（浏览器要求用户手势）
document.addEventListener('pointerdown', ()=>{ ac(); }, { once: true });
// 左上角返回：保留当前进度，直接回首页
document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'navBack'){
    if(session) saveSession();
    renderHome();
  }
});
// 手机键盘弹出后把输入框滚到中间，别被挡住
document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t && t.tagName === 'INPUT'){
    setTimeout(()=>{ try{ t.scrollIntoView({block:'center', behavior:'smooth'}); }catch(err){} }, 260);
  }
});
document.addEventListener('keydown', ()=>{ ac(); }, { once: true });
// 演示用：?demo=1 立刻把“第二次复习”计时归零，便于预览提醒样式
try {
  const qs = new URLSearchParams(location.search);
  if (qs.get('demo') === '1') {
    S.timerAt = Date.now();
    S.reviewedDate = '';
  }
} catch (e) {}
migrateDayBoundary();
fixTodayWords();
backfillEver();
applyBg();
try{
  const tb = document.getElementById('testBadge');
  if(tb && IS_TESTMODE){
    tb.textContent = ' 测试模式';
    tb.style.cssText = 'margin-left:8px;font-size:11px;color:#ffc857;border:1px solid #5a4a1a;border-radius:6px;padding:1px 6px';
    document.body.style.filter = 'none';
  }
}catch(e){}
renderHome();
pullState();
maybeNotify();
checkTimer();
setInterval(()=>{ maybeNotify(); checkTimer(); }, 20000);
// 调试：?test=1 用 1 个词快速跑一整轮
try{
  const qsT = new URLSearchParams(location.search);
  if(qsT.get('test') === '1' && qsT.get('seed') !== 'root'){
    S = blank();
    S.goal = 1;
    S.dayNew = {date:'', n:0};
    S.timerAt = 0; S.studyAt = 0; S.firedAt = 0;
    clearSession(); save();
    setTimeout(()=> startSession(false), 80);
  }
}catch(e){}
document.addEventListener('keydown', e=>{
  if(e.defaultPrevented) return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const nx = document.getElementById('next');
  if(nx && !nx.classList.contains('hide') && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); nx.click(); }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Control' && !e.repeat){
    const f = document.getElementById('forgot');
    if(f){ e.preventDefault(); f.click(); }
  }
  if(e.key === 'CapsLock' && !e.repeat){
    const b = document.getElementById('pronBtn');
    if(b){ e.preventDefault(); b.click(); }
  }
});
</script>
